# --- Equivalent. ---------------------------------------------------------------------------------

[[survivor]]
file = "src/seal.rs"
mutation = "replace || with && in seal_range_with_snapshot"
reason = """
The aging pass skips a table when the cut has no time or the table was touched. With `&&` it also
visits those, and changes nothing: with no cut time `aged` is false, and a touched table's only tail
was written this cut by `provisional`, which already requires that it has not aged, so the same
check cannot flip it. The mutant costs a file read and no state.
"""

[[survivor]]
file = "src/chunker.rs"
mutation = "replace > with >= in AdaptiveWindow::served_whole"
reason = """
`self.max > l` after a doubling. Recovery runs only while `max` is under the configured cap, and there
`max >= learned` always holds: a refusal takes `learned` to at most the new `max`, `set_max` sets
`max` to `learned` unless the cap is lower (and then there is no recovery), and a doubling raises
`learned` to `max`. A doubling strictly raises `max`, so after it `max > l` and `>=` agree.
"""

# --- Timeouts (#853). ---------------------------------------------------------------------------
#
# These two are not slow builds. Each inverts a signal the adaptive window controller steers by,
# the controller then stops advancing, and a **named test waits for it forever** rather than failing.
# Recovered from the per-mutant logs of the 2026-08-24 run, each of which reports its test as "has
# been running for over 60 seconds" before the sweep is killed.
#
# They are recorded rather than chased because the fix is a judgement call the board should make:
# bounding the five affected tests is a ten-site test-only change, while a no-progress guard in the
# backfill loop itself is one change that also closes the production hazard #672 describes ("a window
# 10x over a cap fails whole and retries forever"). The second is a behaviour change under the
# freeze. Removing these entries is the good direction and needs no ceremony.
#
# They also cost the sweep 688 seconds each - about half the reason #841 had to split the job.

[[survivor]]
file = "src/chunker.rs"
mutation = "replace AdaptiveWindow::window -> u64 with 0"
reason = """
A window of zero blocks means a loop that advances by `window` never advances. Three tests hang:
`indexer::tests::a_contract_free_nest_issues_no_getlogs_on_any_backfill_path`,
`a_timestamp_free_nest_backfills_without_a_single_timestamp_call`, and
`both_tip_loops_still_fetch_logs_for_a_nest_with_contracts`.
"""

[[survivor]]
file = "src/chunker.rs"
mutation = "replace is_result_too_large -> bool with false"
reason = """
A provider cap is never recognised, so the narrowing retry never narrows and re-asks at the same
width forever. `indexer::tests::pass_two_shrinks_the_window_on_a_provider_cap` hangs. Note the
sibling mutation `-> true` is caught in 137s, so the tests do bound the other direction.
"""
