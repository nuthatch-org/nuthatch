# Jules is an independent GitHub App reviewer, not an advisory Actions comment.
# The App owns `Jules approval`, which is green only for a `ship` verdict. A finding, malformed
# response, or failed review is red until a fix is pushed or a maintainer asks for `/re-review`.
#
# `pull_request_target` runs this trusted default-branch workflow with the App key, but PR code is
# never checked out or executed. The diff is fetched as data, so forks can be reviewed safely too.
name: Jules review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Workflow-level concurrency is evaluated before the job's `if`. An irrelevant issue-comment
  # event therefore used to enter this group, skip its job, and still cancel a live review for the
  # same PR. Jules's own posted review comment was enough to kill the run before it published its
  # approval. Give comments that cannot request a review their own disposable group; genuine
  # `/re-review` comments, PR synchronises and manual dispatches still supersede one another.
  group: >-
    jules-review-${{
      github.event_name == 'issue_comment' &&
      !(github.event.issue.pull_request &&
        contains(github.event.comment.body, '/re-review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
      github.run_id || github.event.pull_request.number || github.event.issue.number || inputs.pr
    }}
  cancel-in-progress: true

jobs:
  review:
    name: Jules workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/re-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: which pull request
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "invalid PR number" >&2; exit 1;; esac
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: mint Jules App token
        id: jules
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.JULES_APP_ID }}
          private-key: ${{ secrets.JULES_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write

      - name: fetch PR data and create Jules check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_TOKEN: ${{ steps.jules.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid' > head.sha
          # gh refuses a diff that carries ANSI escapes (a deleted terminal log does); keep it, minus ESC.
          gh pr diff "$PR" --repo "$REPO" --allow-escape-sequences | tr -d '\033' > pr.diff
          gh pr view "$PR" --repo "$REPO" --json title --jq '.title' > pr.title
          gh pr view "$PR" --repo "$REPO" --json body --jq '.body' > pr.body
          # The commit range, not just the diff (#1056). Reviewing the 3.1.0 release PR, Jules
          # reported at high severity that the wasmtime security fix "is not present in the diff"
          # and that RUSTSEC-2026-0268/0269 "remain present". Both false: the bump landed eleven
          # commits earlier and was already on the base. A release is a *range*, and no reviewer
          # reading only the diff could have got that right. Subjects only - cheap, and enough to
          # tell "absent from this diff" from "absent from the release".
          # `gh pr view --json commits` caps at 100 (GraphQL page limit), and a release PR can
          # exceed that - silently, which is the failure mode this whole change exists to remove.
          # The REST commits endpoint paginates, and the count is stated so a truncated history
          # cannot pass for a complete one. Review of #1056.
          base="$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq '.baseRefName')"
          # NOT swallowed. `|| : > pr.commits` turned a transient API error into an empty file,
          # which `pr-review.sh` renders as the same `(not supplied)` marker it uses when no file
          # was passed - so the review would proceed from the diff alone and produce a verdict,
          # recreating the exact missing-context failure this change exists to prevent. Review of
          # #1056, and the second time in this PR a fix reintroduced its own fault by failing soft.
          if ! gh api --paginate "repos/$REPO/pulls/$PR/commits" \
               --jq '.[] | "\(.sha[0:9]) \(.commit.message | split("\n")[0])"' > pr.commits; then
            echo "::error::could not fetch the commit list; refusing to review from the diff alone"
            exit 1
          fi
          [ -s pr.commits ] || { echo "::error::the commit list came back empty for PR $PR"; exit 1; }
          # The base goes in its OWN file, not appended to the commit list. Appending it made the
          # prompt's "Commits on this branch (N)" count it as a commit, so a two-commit PR announced
          # three - a number stated to be trustworthy that was wrong by one. Review of #1056.
          printf '%s' "$base" > pr.base
          # **What the base already carries since the last release** (#1201). The commit list above
          # is this branch's own, which answers a different question: a release branch cut *after*
          # its fix merged holds the version bump and nothing else, so the reviewer reads the
          # release note, finds no implementation beside it, and reports the fix missing from a
          # release that contains it. It did exactly that three times running on the 3.6.1 PR, at
          # certainty 100, while the code sat one commit below on `main`. #1056 fixed the same
          # blindness from the other side and could not have caught this one.
          #
          # The compare endpoint returns at most 250 commits but always the true `total_commits`, so
          # both numbers are stated and a truncated range cannot pass for a whole one - the same
          # rule the branch list follows.
          prev_tag="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "$prev_tag" ]; then
            # No release to compare against is a fact, not a failure - it is true of a repository
            # before its first tag. Say so; do not leave an empty file that reads as an empty range.
            printf '%s' "(no previous release to compare against)" > pr.base_range
            : > pr.base_commits
          else
            # NOT swallowed, for the reason stated above the branch list: an error that becomes an
            # empty file renders as `(not supplied)` and the review proceeds from the diff alone,
            # recreating the failure this exists to prevent.
            if ! gh api "repos/$REPO/compare/$prev_tag...$base" > compare.json; then
              echo "::error::could not compare $prev_tag...$base; refusing to review a release without knowing what it contains"
              exit 1
            fi
            jq -r '.commits[] | "\(.sha[0:9]) \(.commit.message | split("\n")[0])"' compare.json > pr.base_commits
            listed="$(wc -l < pr.base_commits | tr -d ' ')"
            total="$(jq -r '.total_commits' compare.json)"
            printf '%s...%s (%s of %s commits listed)' "$prev_tag" "$base" "$listed" "$total" > pr.base_range
          fi
          # **What this branch actually changes.** `gh pr diff` is the diff against the PR's own
          # base, and a branch stacked on another feature branch that has since merged `main` in
          # carries the whole of main in that diff. Jules then reviews files it has already
          # reviewed and shipped on the pull requests they belong to - it raised a `high` against
          # `src/analytics_budget.rs` on a subgraph-tooling PR hours after shipping that file at
          # 88/100 on the PR that wrote it. Comparing against the DEFAULT branch answers the
          # question the reviewer actually needs: which files would merging this change?
          default_branch="$(gh api "repos/$REPO" --jq '.defaultBranch // .default_branch')"
          head_sha="$(cat head.sha)"
          if ! gh api --paginate "repos/$REPO/compare/$default_branch...$head_sha" \
               --jq '.files[].filename' > pr.own_files; then
            echo "::error::could not compare $default_branch...$head_sha; refusing to review without knowing which files are this branch's own"
            exit 1
          fi

          # **A truncated file list fails closed.** The compare endpoint caps `files` at 300, and
          # paging it walks commits rather than extending that list. A truncated list is worse than
          # no list: every omitted file is handed to the prompt as already on the default branch, so
          # the reviewer is explicitly told not to raise findings against changes this branch really
          # makes. Refuse instead. The largest pull request in this repository's history changes 44
          # files, so this is a guard rather than a limit anyone should meet. Raised in review of
          # this change.
          own_count="$(wc -l < pr.own_files | tr -d ' ')"
          if [ "$own_count" -ge 300 ]; then
            echo "::error::compare $default_branch...$head_sha listed $own_count files, at or past the endpoint's 300-file maximum; the list is truncated and a review against it would silently ignore the rest"
            exit 1
          fi

          # **What this reviewer already said about this pull request.** Without it every pass
          # starts from nothing, re-raises settled ground, and reverses its own verdict: one PR
          # took thirteen passes and went back to changes-requested four times after shipping.
          # Not fatal when it fails - a first pass legitimately has none, and the prompt says so.
          #
          # **Filtered by author, not just by marker.** The marker is a comment body, so anyone who
          # can comment on the pull request can write one - and this input is handed to the model as
          # its own previous reviews, under a rule that forbids moving from `ship` to
          # changes-requested without a changed hunk. A forged `ship` would therefore pin the
          # verdict, and forged prose would arrive as instructions. `[bot]` logins are reserved by
          # GitHub and cannot be registered by a person, so author login plus `type == "Bot"` is not
          # forgeable by a PR author. Raised in review of this change.
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.type == "Bot" and .user.login == "nuthatch-jules[bot]")
                       | select(.body | contains("<!-- pr-review:luna -->")) | .body' \
            > pr.prior_reviews || : > pr.prior_reviews

          # Maintainers' replies since the last review, and the base branch's bodies of the functions
          # the diff calls. Without them Jules re-raised findings a cited reply or an untouched callee
          # already disproved (#1349, #1368). The script treats the diff and comments as data only.
          if ! gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[]' > pr.comments.jsonl ||
             ! gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq '.[]' > pr.review_comments.jsonl; then
            echo "::error::could not fetch the pull request's comments; refusing to review without the replies"
            exit 1
          fi
          bash scripts/jules-context.sh --diff pr.diff --comments pr.comments.jsonl \
            --review-comments pr.review_comments.jsonl \
            --replies-out pr.author_replies --callee-out pr.callee_context

          payload="$(jq -n --rawfile sha head.sha --arg id "pr-${PR}-${GITHUB_RUN_ID}" \
            '{name:"Jules approval",head_sha:($sha | rtrimstr("\n")),status:"in_progress",external_id:$id,output:{title:"Jules is reviewing",summary:"The App is reading this pull request."}}')"
          check_id="$(GH_TOKEN="$JULES_TOKEN" gh api --method POST "repos/$REPO/check-runs" --input - --jq '.id' <<<"$payload")"
          echo "id=$check_id" >> "$GITHUB_OUTPUT"

      # A cancelled run must not leave a verdict behind (#1056).
      #
      # `concurrency: cancel-in-progress` is right - reviewing a superseded commit is waste - but the
      # killed run left `Jules approval` sitting at **failure** from the review it interrupted. The PR
      # then reads red with no finding behind it, and during #1054 that state was reported as "still
      # red" repeatedly when nothing had failed: a review had been killed by the next push. A red
      # check must mean a finding.
      - name: a superseded review is neutral, not failed
        if: cancelled()
        env:
          JULES_TOKEN: ${{ steps.jules.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check.outputs.id }}
        run: |
          set -uo pipefail
          [ -n "${CHECK_ID:-}" ] || exit 0
          payload="$(jq -n '{status:"completed",conclusion:"neutral",output:{
            title:"Superseded by a newer commit",
            summary:"This review was cancelled because the branch moved under it. It is not a verdict, and nothing was found. The run for the new head decides."}}')"
          # NOT swallowed. If neutralising fails, the check stays red from the run this cancelled -
          # the exact state this step exists to prevent - and swallowing it means nobody ever finds
          # out. A visible failure here is a workflow problem to fix; a silent one is a PR that
          # reads red forever with no finding behind it. Review of #1056.
          if ! GH_TOKEN="$JULES_TOKEN" gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" \
               --input - <<<"$payload" >/dev/null; then
            echo "::error::could not neutralise the superseded check-run $CHECK_ID - it will stay red with no finding behind it"
            exit 1
          fi

      - name: review, report, and conclude
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_TOKEN: ${{ steps.jules.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          conclusion=failure
          title="Jules could not complete the review"
          summary="The review failed closed. Fix the workflow or credentials, then comment /re-review."
          if bash scripts/pr-review.sh --diff pr.diff --title "$(cat pr.title)" \
              --body-file pr.body --commits-file pr.commits --base-file pr.base \
              --base-commits-file pr.base_commits --base-range "$(cat pr.base_range)" \
              --own-files-file pr.own_files --prior-reviews-file pr.prior_reviews \
              --author-replies-file pr.author_replies --callee-context-file pr.callee_context \
              --json > review.json; then
            {
              echo '<!-- pr-review:luna -->'
              jq -r '"### Jules · merge-safety \(.confidence)/100\n\nverdict: **\(.verdict)**\n\n\(.summary)\n"' review.json
              jq -r 'if (.findings | length) == 0 then "No findings.\n" else "#### \(.findings | length) finding(s)\n\n" + ([.findings[] | "- \(.severity) · certainty \(.certainty // "?")/100 · \(.file):\(.line) - **\(.title)**\n  \(.detail)"] | join("\n")) + "\n" end' review.json
              echo '<sub>Jules · gpt-5.6-luna · required approval · push a fix or comment `/re-review` to run again</sub>'
            } > review.md
            if GH_TOKEN="$JULES_TOKEN" gh pr comment "$PR" --repo "$REPO" --body-file review.md; then
              verdict="$(jq -r '.verdict' review.json)"
              findings="$(jq '.findings | length' review.json)"
              if [ "$verdict" = ship ]; then
                conclusion=success
                title="Jules approves"
                summary="Jules returned ship with no blocking finding."
              else
                title="Jules requests follow-up"
                summary="Verdict: $verdict. Jules recorded $findings finding(s). Ask Claude to address them, push the fix, then comment /re-review if an immediate new pass is wanted."
              fi
            else
              summary="Jules produced a review but could not post it. Check the App Pull requests permission, then comment /re-review."
            fi
          else
            summary="Jules did not return a complete structured review. This is intentionally red rather than pretending the PR was approved. Comment /re-review after the failure is corrected."
          fi
          payload="$(jq -n --arg conclusion "$conclusion" --arg title "$title" --arg summary "$summary" \
            '{status:"completed",conclusion:$conclusion,output:{title:$title,summary:$summary}}')"
          GH_TOKEN="$JULES_TOKEN" gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" --input - <<<"$payload"
          [ "$conclusion" = success ]
