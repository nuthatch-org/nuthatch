# Mutation coverage on the delightful core (#768), split per file so it finishes (#841).
#
# **Weekly, not per-PR, and the reason is measured rather than assumed.** (Weekly rather than nightly
# since #1999: a sweep costs about 1,600 runner-minutes.) On an 18-core box:
#
#   - unmutated baseline: 114s build + 154s test (all targets), or 122s + 28s with `--lib`
#   - each mutant needs its own rebuild, so ~150s apiece even with the test phase scoped
#   - at `-j 6` the box hit **load 70** and individual builds stretched to 802s
#
# A per-PR gate at those numbers is one people learn to skip, which is the exact disease this is
# meant to cure. #768's own "honest risk" section said so before any of it was measured, and the
# measurement agreed.
#
# **This workflow does not fail the build and is required on no branch.** Per #768's acceptance
# criterion 2 and the sequence #593 spent a whole sprint getting right: prove it can go red, let it
# run red-capable on `main`, *then* decide whether it becomes required. A context that cannot fail is
# worse than no context, and this repo has installed one of those before.
#
# ## Why this is a matrix (#841)
#
# It was one job over all three files with `timeout-minutes: 300`. It ran three times and was
# cancelled at exactly 300 minutes three times, having produced a complete set of outcomes and then
# died before the step that reports them. Nobody found out, because `mutants-check.py` read the
# absent `missed.txt` as "no survivors" and exited 0. Both halves are fixed: the checker now fails on
# a truncated run, and the sweep is split so it fits.
#
# Sizing is from the artifact of the 2026-08-24 run, not from a guess - summed phase durations at
# `-j 2` on a GitHub runner:
#
#   | file             | mutants | measured  | + baseline | timeout here |
#   |------------------|--------:|----------:|-----------:|-------------:|
#   | src/chunker.rs   |     ~26 |  ~222 min |   ~138 min |      240 min |
#   | src/seal.rs      |     ~10 |   ~77 min |    ~66 min |      150 min |
#   | src/registry.rs  |       3 |   ~13 min |    ~34 min |      120 min |
#
# The unmutated baseline is 26.6 min and each job pays it once; they run in parallel, so wall clock
# is the chunker column. Three chunker mutants are pathological (16-40 min each) - those are the
# cargo-mutants test timeouts, tracked in #842.
name: mutants (delightful core)

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  mutants:
    name: mutation coverage (weekly, advisory) - ${{ matrix.file }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Every file reports independently. One file blowing its budget must not hide the other two,
      # which is the shape the single-job version had.
      fail-fast: false
      matrix:
        include:
          # Scoped deliberately. Not the whole crate: 4,503 mutants crate-wide against about 230 here, and a
          # signal nobody reads is not a signal. These are the paths that feed stored state or decide
          # what gets fetched - where a decorative test is most expensive.
          #
          # Sharded since #1715. seal.rs went from about 10 mutants to 185 and chunker.rs from 26 to
          # 43, at seven to nine minutes a mutant, and a job cannot run past 360 minutes. A shard is
          # sized to about 25 mutants.
          - { file: src/chunker.rs, shard: 0/2, timeout: 330 }
          - { file: src/chunker.rs, shard: 1/2, timeout: 330 }
          - { file: src/seal.rs, shard: 0/8, timeout: 330 }
          - { file: src/seal.rs, shard: 1/8, timeout: 330 }
          - { file: src/seal.rs, shard: 2/8, timeout: 330 }
          - { file: src/seal.rs, shard: 3/8, timeout: 330 }
          - { file: src/seal.rs, shard: 4/8, timeout: 330 }
          - { file: src/seal.rs, shard: 5/8, timeout: 330 }
          - { file: src/seal.rs, shard: 6/8, timeout: 330 }
          - { file: src/seal.rs, shard: 7/8, timeout: 330 }
          # Only 3 mutants because #581 moved decode into its own crate, so the decode path is
          # covered by the `decode` entry rather than by the file it used to live in.
          - { file: src/registry.rs, shard: 0/1, timeout: 120 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Restores main's default build and never saves: a sweep's own entry evicted the caches
          # every PR restores from (#1999).
          shared-key: check-default-check-default
          save-if: false
      # SIGBUS from `ld` is the disk, not the code (#1387). All three matrix jobs died the same way
      # on the 2026-09-14 scheduled run - `collect2: fatal error: ld terminated with signal 7 [Bus
      # error]` - which is the fault `ci.yml` already carries this exact step for, added after it
      # was misdiagnosed twice because nothing measured the disk (#464, #639, #733). It was never
      # applied here.
      #
      # This job is the hungriest there is: cargo-mutants rebuilds the tree **per mutant** into its
      # own temp target dir, on top of the baseline build and the shared cache, so it has less
      # headroom than the job the step was written for rather than more.
      #
      # The `df` lines stay, for the same reason they stay in `ci.yml`: a run that dies for want of
      # disk must say so in its own log rather than leave the next person inferring it from SIGBUS.
      - name: reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache
          df -h /
      - name: install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: run mutants
        # `continue-on-error` rather than `set +e`: cargo-mutants exits non-zero when mutants survive,
        # which is an ordinary outcome this job must not treat as breakage. The previous version
        # swallowed the status into a `$GITHUB_OUTPUT` that nothing ever read, so a *crashed* run and
        # a run with survivors were equally invisible. The verdict now comes from the artifact, which
        # can tell those two apart; the raw status stays visible in this step's log.
        continue-on-error: true
        # The wide-batch RSS test measures the child process, and on a loaded runner it sits a few
        # tens of megabytes over its 512 MiB ceiling before any mutant is scored (#2030, run
        # 38128606532). Skipping it here leaves it in the ordinary suite. A baseline entry cannot
        # help: the failure is the unmutated tree, not a survivor.
        run: cargo mutants --no-shuffle -j 2 --file ${{ matrix.file }} --shard ${{ matrix.shard }} -- --lib -- --skip a_wide_batch_stays_under_the_cursor

      # `if: always()` so the reading survives the failure it explains - the whole point of #733's
      # trailing `df` in `ci.yml`. Without it, the run that runs out of disk is the one run with no
      # disk measurement in it.
      - name: disk after the run
        if: always()
        run: df -h /

      # **This step can go red, and that is the point** (#768 acceptance criterion 1). A survivor not
      # in the baseline fails the job and names the mutation and the file. So does a run that did not
      # finish, or one that enumerated no mutants at all. The job going red is not the same as the
      # build going red: this workflow is required on no branch, per criterion 2 and the sequence
      # #593 established.
      #
      # `shell: bash` is load-bearing (#911). Without it a `run:` step is `bash -e {0}` with no
      # `pipefail`, so this pipeline exits with `tee`'s status and `tee` always succeeds. The claim
      # directly above was false from the day it was written: on run 33076912079 this step printed
      # "FAIL: ... cargo-mutants was killed before it finished ... This is a failure and not a pass"
      # and reported `success`. #841 and #853 hardened the script to refuse a truncated run; this
      # line threw the refusal away. `shell: bash` supplies `-o pipefail` and gives the script's
      # exit status back to the step.
      - name: new survivors fail this job
        if: always()
        shell: bash
        run: python3 scripts/mutants-check.py --file ${{ matrix.file }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: keep the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per file, or the three jobs race for one artifact name.
          name: mutants-out-${{ strategy.job-index }}
          path: mutants.out/
          retention-days: 14

  # **A failed scheduled run is invisible, so it files an issue** (#1130). A `schedule:` run
  # attaches its check to no pull request, and a red nightly is not what the branch badge reflects,
  # so `required contexts match protection` sat red for six consecutive days unnoticed.
  #
  # Only `github.event_name == 'schedule'`: a failing `pull_request` or `push` run already surfaces
  # itself on the PR or the commit, and filing an issue for those would be noise. Guarded by
  # `tests/scheduled_workflow_failure_is_reported.rs`, which checks this condition rather than only
  # the job's presence - a reporter that can never fire would otherwise pass a presence check.
  #
  # A job that hits `timeout-minutes` ends `cancelled`, and `failure()` is false for it. Twelve
  # nightly runs timed out from 2026-09-21 and this job was skipped on every one (#1715).
  report-scheduled-failure:
    name: surface a failed scheduled run
    needs: [mutants]
    if: always() && github.event_name == 'schedule' && (failure() || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The reporter is a local composite action, so the tree has to be present to load it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/report-scheduled-failure
