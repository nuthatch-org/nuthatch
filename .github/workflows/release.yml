name: release

# On a version tag, build native binaries per target and attach them to the GitHub Release.
# Built on the pinned toolchain (rust-toolchain.toml → 1.95.0), so the dbsp/next-solver ICE that
# breaks `cargo install` on rustc 1.97 never applies - users download a binary and never compile.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  # #830. `attest-build-provenance` mints a Sigstore bundle signed with a short-lived certificate
  # obtained from GitHub's OIDC provider, so what is attested is the *workflow run on this
  # repository*, not a key somebody holds. `id-token: write` lets the job request that token;
  # `attestations: write` lets it store the result. Neither grants anything a release job that can
  # already write releases and packages did not effectively have.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Creates (or updates) the release with its body, before the matrix starts. Must be a separate
  # job, not a step tacked onto `build`: the first `attach to release` step in that job carries no
  # `if:`, so it runs once per matrix leg, concurrently - give *that* step a body_path and every leg
  # races to set it. Doing it here instead means the matrix's two action-gh-release calls only ever
  # pass `files:`, and softprops/action-gh-release preserves the existing body on an update when the
  # call doesn't set body/body_path (`body = workflowBody || existingReleaseBody`, src/github.ts) -
  # so attaching files afterward can't blank out what this job wrote.
  release-notes:
    name: release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: resolve release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes not found. Every tagged release needs its notes written at that path before tagging - see docs/releases/README.md."
            exit 1
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      # Created as a **draft** (#626). This job runs before a single binary has been built, so a
      # published release here means a failing matrix leaves a live, fully-annotated release with no
      # assets attached, visible to anyone watching the repo and to `gh release download`. A draft is
      # visible only to people with write access, so the failure stays private until it is fixed.
      # The `publish` job at the bottom flips it once everything has actually built.
      #
      # The draft flag is repeated on every action-gh-release call in this workflow rather than set
      # once here, because the attach steps below issue *updates* against this release and the
      # action's handling of an unset draft input on update is not something to bet a public release
      # on. Stating it each time costs a line and removes the question.
      # A tag carrying a semver pre-release identifier (the `-` in `v3.0.0-alpha.1`) is marked as a
      # prerelease. `prerelease` defaults to **false** in action-gh-release's own action.yml, so
      # without this an alpha publishes as a full release and takes the repo's "Latest release"
      # badge - the first thing anyone landing on the repo is offered. Repeated on every call for
      # the same reason `draft` is: the attach steps below issue *updates*, and an unset input on
      # update is not a thing to bet a public release on.
      - name: create draft release with notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # #2035: one job per (target, variant), so a tag takes the slowest single `dist` link rather than
  # the sum of three in series. Asset names are unchanged: `nuthatch-[<variant>-]<target>.tar.gz`.
  build:
    name: ${{ matrix.target }} ${{ matrix.variant }}
    needs: release-notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-22.04-arm]
        variant: [default, scaled, graph]
        include:
          # Apple Silicon. #2037: off `macos-14`, which GitHub retires on 2 November 2026. macOS swaps
          # on its own, so the Linux swap step below has no counterpart here.
          - os: macos-15
            target: aarch64-apple-darwin
          # Pinned to 22.04 (glibc 2.35), NOT `ubuntu-latest`. A dynamically-linked binary requires the
          # glibc it was built against *or newer*, so the builder's glibc is the floor for every system
          # that can run the release. On `ubuntu-latest` (24.04, glibc 2.39) that floor silently rose to
          # 2.39, excluding Debian 12, Ubuntu 22.04, RHEL 9 and Amazon Linux 2023 - and it went unnoticed
          # because every box we test on is modern Ubuntu.
          #
          # It surfaced when the container job's smoke test ran the binary against `debian:bookworm-slim`
          # (glibc 2.36) and got `version 'GLIBC_2.39' not found`. **The image base must stay >= this
          # runner's glibc**; bookworm's 2.36 covers 22.04's 2.35 with room to spare.
          - os: ubuntu-22.04    # x86_64 Linux (glibc 2.35 - the portability floor)
            target: x86_64-unknown-linux-gnu
          # #1961: native arm64, not cross-compiled, on the 22.04 image for the same 2.35 floor. An
          # arm64 host otherwise runs the x86_64 binary under qemu, too slow to serve a stopgap nest.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # x86_64-apple-darwin (Intel Mac) is intentionally omitted: macos-13 runners are scarce
          # and Intel Macs are a shrinking minority; those users build from source (cargo install)
          # or run under a future addition. The installer routes them to the build-from-source path.
          - variant: default
            prefix: ''
            features: ''
          # The **scaled-mode** binary: `--features postgres-store`, which is what a fleet operator
          # needs (`nuthatch worker`, `nuthatch control`, `serve --hot-store`). Shipped separately
          # because non-negotiable 1 says the primary artifact runs with zero external services, and a
          # binary carrying a Postgres driver is a different promise even if it behaves identically.
          - variant: scaled
            prefix: 'scaled-'
            features: '--features postgres-store'
          # The **graph** binary (#1950): `--features graph`, which serves a nest's Graph-dialect
          # GraphQL (RFC-0053) and the RFC-0060 facade. Kept out of the default binary by the
          # 2026-09-21 rule, but shipped, so a stopgap operator does not have to build from source.
          - variant: graph
            prefix: 'graph-'
            features: '--features graph'
        # Scaled, and the container image, stay x86_64 Linux.
        exclude:
          - os: macos-15
            variant: scaled
          - os: ubuntu-22.04-arm
            variant: scaled
    env:
      TARBALL: nuthatch-${{ matrix.prefix }}${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
          # #1396: no save. A tag build's cache is scoped to that tag, so no later run can read it,
          # yet each release spent ~1.6 GB of the 10 GB store CI restores from, evicting CI's entries.
          save-if: false
      # The fat-LTO link of `nuthatch` outgrew the ARM runner's memory: v5.0.0's aarch64 build was
      # shut down mid-link twice. Swap lets it finish without changing what the profile builds.
      - name: swap for the fat-LTO link
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          df -h /
          sudo fallocate -l 16G /swapfile.lto
          sudo chmod 600 /swapfile.lto
          sudo mkswap /swapfile.lto
          sudo swapon /swapfile.lto
          free -h
      - name: build
        run: cargo build --profile dist --locked ${{ matrix.features }} --target ${{ matrix.target }}
      - name: package
        run: |
          tar czf "$TARBALL" -C "target/${{ matrix.target }}/dist" nuthatch
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          ls -lh "$TARBALL"
      - name: attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            nuthatch-${{ matrix.prefix }}${{ matrix.target }}.tar.gz
            nuthatch-${{ matrix.prefix }}${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

      # **#830: a checksum from the same release proves nothing.** A `.sha256` sidecar downloaded
      # beside the tarball it describes says only that the file did not corrupt in transit. Anyone
      # able to replace the tarball can replace the sidecar in the same breath, and a compromised
      # release credential or a retagged action (#829) leaves both perfectly consistent.
      #
      # An attestation is signed by GitHub's OIDC identity for this workflow run and recorded in a
      # public transparency log, so it answers what the sidecar cannot: who built this, from which
      # commit, in which workflow. There is no key for us to hold, rotate, or leak.
      #
      # Attested **here**, on the machine that produced the file, not in `publish`: attesting a file
      # downloaded back from the release would certify only that we successfully downloaded whatever
      # is sitting there.
      - name: attest the built artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nuthatch-${{ matrix.prefix }}${{ matrix.target }}.tar.gz
      # Hand the x86_64 Linux default and scaled binaries to the container job, so the images ship the
      # same artifacts attached to the release rather than a second build nobody diffed.
      - name: keep the binary for the image
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant != 'graph'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.variant == 'scaled' && 'nuthatch-scaled-binary' || 'nuthatch-linux-binary' }}
          path: target/${{ matrix.target }}/dist/nuthatch
          retention-days: 1

  # Publish the container image (RFC-0005 release engineering). "Build it yourself from this Dockerfile"
  # is not a deployment story for a platform team, which is what this closes.
  container:
    name: container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuthatch-linux-binary
      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: version
        id: v
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Build locally, prove it runs, and only then publish - in that order. It used to push first and
      # smoke-test the pushed tag, which meant a failing test failed the *job* but left the broken image
      # public: v0.7.0 published a `:0.7.0` and a `:latest` that died with `GLIBC_2.38 not found`, and a
      # red tick in Actions does not un-pull an image someone already has.
      #
      # x86_64 only. The release now builds an aarch64-linux binary too (#1961), but a multi-arch image
      # is not built from it yet - stated rather than implied.
      - name: build the image
        run: docker build --platform linux/amd64 -t nuthatch:candidate .
      - name: smoke-test before publishing
        run: docker run --rm nuthatch:candidate --version
      - name: push the tested image
        run: |
          # `docker tag` of the smoke-tested image, not a rebuild: what ships is the exact thing that
          # passed above, same digest.
          for tag in "${{ steps.v.outputs.tag }}" latest; do
            docker tag nuthatch:candidate "ghcr.io/${{ github.repository }}:$tag"
            docker push "ghcr.io/${{ github.repository }}:$tag"
          done
      # The scaled-mode image, tagged `-scaled`. Same Dockerfile, different binary. **Not** tagged
      # `latest`: the default image stays the one you get by not thinking about it, because embedded
      # mode is the primary deliverable and the scaled one carries a database driver.
      - name: fetch the scaled binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuthatch-scaled-binary
          path: scaled
      - name: build, test and push the scaled image
        run: |
          cp scaled/nuthatch ./nuthatch
          docker build --platform linux/amd64 -t nuthatch:scaled .
          # Same ordering discipline as above - prove it runs before publishing it. The extra check
          # here is that the scaled subcommands actually exist, which is the entire point of the image:
          # a `-scaled` tag whose binary lacks `worker` would be worse than no tag.
          docker run --rm nuthatch:scaled --version
          docker run --rm nuthatch:scaled worker --help > /dev/null
          docker run --rm nuthatch:scaled control --help > /dev/null
          docker tag nuthatch:scaled "ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}-scaled"
          docker push "ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}-scaled"

  # The release goes public here and nowhere else (#626). Everything above builds against a draft:
  # three binary targets with their scaled and graph variants, and two container images that are
  # smoke-tested before they are pushed. Only when all of that has succeeded does the release stop
  # being a draft.
  #
  # `needs: container` rather than `needs: build`, and that is a deliberate choice rather than an
  # oversight: an image is part of what a release promises (RFC-0005), so a green matrix with a failed
  # container job is an incomplete release and a human should decide what to do about it. Which they
  # can, cheaply - the draft is sitting there with its notes and its binaries already attached, and
  # the recovery is one command, stated here because a failure message that names an unreachable
  # recovery path is worse than none:
  #
  #     gh release edit v<x.y.z> --draft=false
  #
  # There is no `if: always()`. A failure upstream must leave this job unrun, because "publish it
  # anyway" is the exact behaviour the issue was filed about.
  publish:
    name: publish the release
    needs: container
    runs-on: ubuntu-latest
    steps:
      # #830 asks the workflow to verify artifact identity **before publishing**, which is the half
      # that makes an attestation load-bearing rather than decorative. This downloads the release's
      # own assets and verifies each against the transparency log - the same command a user runs, run
      # once by us first - so a release whose provenance does not verify never becomes public.
      #
      # `--repo` is what binds it. Without that flag `gh attestation verify` will accept an
      # attestation from *any* repository, which is most of the property we are trying to establish.
      - name: verify provenance before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' --clobber
          shopt -s nullglob
          files=(*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tarballs on the release to verify - the build matrix attached nothing"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "--- $f ---"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
          echo "provenance verified for ${#files[@]} artifact(s)"

      - name: undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false \
            --prerelease=${{ contains(github.ref_name, '-') }} --repo "$GITHUB_REPOSITORY"
          echo "published $GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
