name: Link with mold
description: >
  Install mold from the runner's Ubuntu archive and make the host-target links use it (#3041).
  Set through the per-target variable, so the wasm32 flags in embed/.cargo/config.toml and the
  RUSTFLAGS some yatr tasks set for wasm are untouched.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends mold >/dev/null
        mold --version
        echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
