name: Link with mold
description: >
  Install mold from the runner's Ubuntu archive and make the host-target links use it (#3041).
  Set through the per-target variable, so the wasm32 flags in embed/.cargo/config.toml and the
  RUSTFLAGS some yatr tasks set for wasm are untouched.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # Refresh the package index first: runner lists can be stale, and install fails on an unknown package.
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends mold >/dev/null
        mold --version
        # The CARGO_TARGET_<triple>_RUSTFLAGS env var REPLACES any [target.<triple>] rustflags, it does not
        # append to them. The repo has no host-triple rustflags (embed/.cargo/config.toml only sets
        # wasm32-unknown-unknown, and no workflow sets RUSTFLAGS), so there is nothing to merge. If a
        # host-triple rustflags entry is ever added, put its flags into this value too.
        echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
