# Pins are immutable SHAs (#829), which is the point: a retagged action cannot run with our release
# credentials. The cost of immutability is that a pin never advances on its own, so an action with a
# fixed vulnerability sits at the vulnerable commit indefinitely. Dependabot is what pays that cost -
# it opens a PR raising the SHA, with the release notes, and CI decides.
#
# Without this, #829 trades a supply-chain risk for a staleness one and calls it a win.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # Deliberately no blanket label. The first run labelled five routine version bumps `security`,
    # which is how a label stops meaning anything: if every Dependabot PR is a security PR, none is.
    # A real advisory arrives with GitHub's own security-update flag on it.
    ignore:
      # **`dtolnay/rust-toolchain` must not be bumped automatically** (#928). It encodes the toolchain
      # in the *ref name* rather than an input: `@1.95.0` and `@nightly` are two branches of one
      # repository whose `action.yml` files differ - the former bakes the version into its script and
      # declares no `toolchain` input at all, the latter defaults to `nightly`.
      #
      # Dependabot sees one repository with two pinned SHAs and cannot know they mean different
      # compilers. Its first run proposed rewriting the **nightly** pin to the **1.95.0** SHA, comment
      # still reading `# nightly`, which would have run the fuzz job on stable while looking correct.
      # `cargo-fuzz` requires nightly.
      #
      # Raising these two pins is a hand job, and a rare one: the action changes about twice a year.
      - dependency-name: dtolnay/rust-toolchain
  # The Dockerfile's base is pinned by digest (#2735); this is what moves it when Debian patches it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
