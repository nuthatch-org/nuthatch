[package]
name = "nuthatch-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A nest's cursor without the operating system: decode to commit to seal, and the circuits, over traits a node and a tab both implement."
license = "MIT OR Apache-2.0"
publish = false

[features]
# The `graph` build's hash-to-checkpoint index, rebuilt at every open.
checkpoint-hash-index = []
# The node's tests park an outbox drain by store path.
test-hooks = []
# wasm32 only: a JavaScript host (`fetch`, OPFS, `setTimeout`). Off, the module imports nothing but
# `nuthatch.*` (RFC-0077 S0). Native builds ignore it.
js = ["dep:js-sys", "dep:send_wrapper", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
default = ["js"]

[dependencies]
anyhow = "1"
alloy-primitives = "1.6"
arc-swap = "1"
bytes = "1"
async-trait = "0.1"
dbsp = "0.320"
nuthatch-decode = { path = "../decode" }
nuthatch-seal = { path = "../seal" }
nuthatch-scaffold = { path = "../scaffold" }
futures = "0.3"
hex = "0.4"
redb = "2"
# `Row` derives `SizeOf` and rkyv archival for `dbsp::DBData`; the versions dbsp itself pins.
size-of = { package = "feldera-size-of", version = "0.1.7" }
serde = { version = "1", features = ["derive"] }
# `preserve_order` as nuthatch-decode has it, so a hash over JSON here is the one the binary computes.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
serde_ignored = "0.1"
# RFC-0077 S1: `entities.toml` and its SQL, parsed here so a node and an embedding lower it alike.
sqlparser = { version = "0.62", features = ["visitor"] }
toml = "0.8"
tokio = { version = "1", default-features = false, features = ["macros", "sync"] }
tracing = "0.1"
url = "2"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rkyv = { version = "0.7.46", default-features = false, features = ["std", "size_64", "validation"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rkyv 0.7 archives `usize` as 64-bit only on 64-bit targets; nothing here persists the archive.
rkyv = { version = "0.7.46", default-features = false, features = ["std", "size_32", "validation"] }
# RFC-0075 S2: the OPFS backend.
js-sys = { version = "0.3", optional = true }
send_wrapper = { version = "0.6", features = ["futures"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "AbortSignal",
    "DomException",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemReadWriteOptions",
    "FileSystemSyncAccessHandle",
    "Headers",
    "RequestInit",
    "Response",
    "StorageManager",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }

[dev-dependencies]
alloy-json-abi = "1.6"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
