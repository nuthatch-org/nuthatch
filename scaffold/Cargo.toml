[package]
name = "nuthatch-scaffold"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "The files `nuthatch init` writes, from its resolved inputs, with no filesystem or network."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
alloy-json-abi = "1.6"
alloy-primitives = "1.6"
anyhow = "1"
hex = "0.4"
nuthatch-decode = { path = "../decode" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
