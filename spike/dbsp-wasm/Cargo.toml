[package]
name = "dbsp-wasm-spike"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
# The entity modules are the binary's own files, whose unit tests need the binary; tests/ holds ours.
test = false
doctest = false

[dependencies]
dbsp = "=0.320.0"
# RFC-0075 S1: the crate this build exists to hold to wasm32; the patch below is applied only here.
nuthatch-core = { path = "../../core" }
nuthatch-decode = { path = "../../decode" }
nuthatch-seal = { path = "../../seal" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# RFC-0075 S2: the hot store's database, opened over a tab's backend.
redb = "2"
# RFC-0075 S2: `tests/e2e_reorg.rs`'s depth strategy, drawn by its deterministic runner.
proptest = { version = "1", default-features = false, features = ["std"] }
# As the binary pins them (`Cargo.toml` of nuthatch): `Row` derives `SizeOf` and rkyv archival.
size-of = { package = "feldera-size-of", version = "0.1.7" }
# RFC-0075 S4: the binary's entity builder (`src/entity_decl.rs`, `entity_lower.rs`, `entity_bind.rs`)
# and the engine its `/sql` runs, at the binary's pinned rev.
toml = "0.8"
sqlparser = { version = "0.62", features = ["visitor"] }
alloy-primitives = "1.6"
burrmill = { git = "https://github.com/nuthatch-org/burrmill", rev = "ea8cf40c74b4e9da61983c4658d50d2d18217b7f", default-features = false, features = ["datafusion"] }
object_store = { version = "0.13", default-features = false }
arrow-array = { version = "=59.3.0", default-features = false }
futures = "0.3"
bytes = "1"
hex = "0.4"
nuthatch-scaffold = { path = "../../scaffold" }
form_urlencoded = "1"
percent-encoding = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rkyv = { version = "0.7.46", default-features = false, features = ["std", "size_64", "validation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rkyv 0.7 archives `usize` as 64-bit only on 64-bit targets (see the patch); the layout is in-memory only.
rkyv = { version = "0.7.46", default-features = false, features = ["std", "size_32", "validation"] }
# Feature unification only: these give the wasm32 tree a source of randomness.
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# RFC-0075 S2: `tests/opfs.rs`, in a dedicated worker in headless Chrome. The second worker it starts
# stands in for a second tab.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "FileSystemDirectoryHandle",
    "FileSystemRemoveOptions",
    "MessageEvent",
    "Url",
    "Worker",
] }

# RFC-0075 S0: dbsp 0.320.0 and its feldera siblings, patched in ./vendor for wasm32-unknown-unknown.
[patch.crates-io]
dbsp = { path = "vendor/dbsp" }
feldera-types = { path = "vendor/feldera-types" }
feldera-storage = { path = "vendor/feldera-storage" }
feldera-buffer-cache = { path = "vendor/feldera-buffer-cache" }
feldera-samply = { path = "vendor/feldera-samply" }
feldera-ir = { path = "vendor/feldera-ir" }
feldera-macros = { path = "vendor/feldera-macros" }
feldera-size-of = { path = "vendor/feldera-size-of" }

[workspace]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16

# RFC-0075 S6: the module a tab loads, which CI's gates run after `wasm-opt`.
[profile.tab]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
