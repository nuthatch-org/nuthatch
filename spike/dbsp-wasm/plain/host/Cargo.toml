[package]
name = "plain-host"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "RFC-0077 S0: a non-browser host for the plain module, on wasmtime, that measures what it costs."

[dependencies]
anyhow = "1"
flate2 = "1"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
ureq = "3"
# The last release whose MSRV is the pinned 1.95. Apache-2.0 WITH LLVM-exception.
wasmtime = { version = "48", features = ["winch"] }

[workspace]
