[package]
name = "rfc-0070-s1"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "RFC-0070 S1: nuthatch-timelapse driven by Burrmill, natively and as wasm in Node"
publish = false

# Its own crate, outside the binary: the gates' driver, not a shipped surface. The burrmill rev is the
# one burrmill-wasm builds for a tab, so both sides of the native/wasm comparison run the same engine.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rfc-0070-s1"
path = "src/main.rs"

[dependencies]
burrmill = { git = "https://github.com/nuthatch-org/burrmill", rev = "8ab3048cc81c3d83cc590e407d0c4cf6297236aa", default-features = false, features = ["datafusion"] }
nuthatch-timelapse = { path = "../../timelapse" }
anyhow = "1"
hex = "0.4"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
js-sys = "0.3"
object_store = { version = "0.13", default-features = false }
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
