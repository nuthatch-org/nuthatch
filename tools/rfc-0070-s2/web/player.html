<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time-lapse</title>
<style>
:root {
  --bg: #171614; --bg-elev: #201f1c; --bg-code: #1b1a17; --bg-inset: #262420;
  --border: rgba(255, 255, 255, 0.09); --border-hi: rgba(255, 255, 255, 0.16);
  --text: #ece9e3; --text-muted: #9c978c; --text-faint: #6e6a61;
  --accent: #8bb8dc; --rust: #cd8560; --ok: #86b592; --warn: #cdb06a;
  --pale-blue-bg: rgba(139, 184, 220, 0.12); --pale-rust-bg: rgba(205, 133, 96, 0.12);
  --sans: 'Space Grotesk', ui-sans-serif, system-ui, 'Helvetica Neue', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); letter-spacing: -0.01em; }
main { max-width: 60rem; margin: 0 auto; padding: 28px 16px 40px; }
.kicker { font: 500 0.72rem/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--rust); margin: 0 0 8px; }
h1 { font-size: clamp(1.3rem, 3vw, 1.7rem); line-height: 1.15; letter-spacing: -0.03em; font-weight: 600; margin: 0 0 18px; }
.panel { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.date { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stats { text-align: right; font: 0.78rem/1.6 var(--mono); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.stats .unit { color: var(--rust); }
#chart { position: relative; }
.row { position: absolute; left: 0; right: 0; height: 34px; display: flex; align-items: center; gap: 10px; opacity: 0; transition: transform 160ms linear, opacity 160ms linear; }
.rank { width: 22px; text-align: right; font: 0.72rem var(--mono); color: var(--rust); font-variant-numeric: tabular-nums; }
.label { width: 116px; font: 0.76rem var(--mono); color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.track { flex: 1; height: 24px; background: var(--bg-inset); border-radius: 4px; position: relative; overflow: hidden; }
.bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transition: width 160ms linear; }
.val { width: 96px; text-align: right; font: 0.8rem var(--mono); font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
button, select { font: 0.8rem var(--mono); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-hi); background: var(--bg-inset); color: var(--text); cursor: pointer; }
button:hover, select:hover { border-color: var(--rust); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#play { min-width: 72px; color: var(--accent); }
input[type=range] { flex: 1; min-width: 140px; accent-color: var(--rust); }
.frameno { font: 0.74rem var(--mono); color: var(--text-muted); min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
.prov { margin-top: 20px; font: 0.72rem/1.7 var(--mono); color: var(--text-muted); }
.prov div { overflow-wrap: anywhere; }
.prov .k { color: var(--rust); text-transform: uppercase; letter-spacing: 0.08em; }
.ok { color: var(--ok); } .bad { color: var(--warn); }
.note { margin-top: 14px; font-size: 0.82rem; color: var(--text-muted); max-width: 56ch; }
@media (max-width: 540px) { .label { width: 78px; } .val { width: 70px; } .head { align-items: flex-start; } .stats { text-align: left; } }
@media (prefers-reduced-motion: reduce) { .row, .bar { transition: none; } }
</style>
</head>
<body>
<main id="player" data-frame="">
  <p class="kicker">nuthatch time-lapse</p>
  <h1 id="title"></h1>
  <div class="panel">
    <div class="head">
      <div class="date" id="date"></div>
      <div class="stats"><div id="block"></div><div id="totals"></div></div>
    </div>
    <div id="chart"></div>
    <div class="controls">
      <button id="play" type="button">Play</button>
      <input type="range" id="scrub" min="0" value="0" aria-label="Frame">
      <span class="frameno" id="frameno"></span>
      <select id="speed" aria-label="Frames a second">
        <option value="15">15 fps</option>
        <option value="30" selected>30 fps</option>
        <option value="60">60 fps</option>
        <option value="120">120 fps</option>
      </select>
    </div>
  </div>
  <p class="note">Each frame is the exact state at its closing block, replayed from a nuthatch nest's final sealed segments. Bars ease between frames; the numbers do not.</p>
  <div class="prov">
    <div><span class="k">frames_sha256, recorded</span> <span id="sha"></span></div>
    <div><span class="k">frames_sha256, this file</span> <span id="sha2">not computed</span></div>
    <div id="meta"></div>
  </div>
</main>
<script id="frames" type="application/json">"__FRAMES__"</script>
<script id="manifest" type="application/json">{"__MANIFEST__":1}</script>
<script id="display" type="application/json">{"__DISPLAY__":1}</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var raw = JSON.parse($("frames").textContent);
  var man = JSON.parse($("manifest").textContent);
  var show = JSON.parse($("display").textContent);
  var frames = raw.split("\n").filter(Boolean).map(function (l) { return JSON.parse(l); });
  var TOP = man.top, ROW = 38, DEC = show.decimals || 0, UNIT = show.unit || "", NOUN = show.noun || "keys";

  document.title = man.title;
  $("title").textContent = man.title;
  $("sha").textContent = man.frames_sha256;
  $("meta").textContent = [
    "nest " + man.nest,
    man.fold + " fold, " + man.fold_version,
    "blocks " + man.from_block + " to " + man.to_block,
    man.frames + " frames of " + man.step_blocks + " blocks",
    (man.segments_read ? man.segments_read.length : 0) + " segments read",
    "spec " + man.spec_sha256
  ].join(" · ");

  if (window.crypto && crypto.subtle && window.TextEncoder) {
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw)).then(function (d) {
      var hex = Array.prototype.map.call(new Uint8Array(d), function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
      var same = hex === man.frames_sha256;
      $("sha2").textContent = hex + (same ? "  matches" : "  DIFFERS from the recorded hash");
      $("sha2").className = same ? "ok" : "bad";
    }).catch(function () { $("sha2").textContent = "this browser would not hash it"; });
  }

  // Exact decimal text to a float, for drawing and the printed figure only.
  function scaled(s) {
    var neg = s[0] === "-"; if (neg) s = s.slice(1);
    if (DEC > 0) {
      s = (new Array(DEC + 2).join("0") + s).slice(-Math.max(s.length, DEC + 1));
      s = s.slice(0, s.length - DEC) + "." + s.slice(s.length - DEC);
    }
    var v = parseFloat(s);
    return neg ? -v : v;
  }
  function fmt(v) {
    var a = Math.abs(v);
    if (a >= 1e15) return v.toExponential(2);
    if (a >= 1e12) return (v / 1e12).toFixed(2) + "T";
    if (a >= 1e9) return (v / 1e9).toFixed(2) + "B";
    if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
    if (a >= 1e3) return (v / 1e3).toFixed(1) + "K";
    return a >= 10 || a === 0 ? v.toFixed(1).replace(/\.0$/, "") : v.toFixed(2);
  }
  function withUnit(v) { return UNIT === "%" ? fmt(v) + "%" : fmt(v) + (UNIT ? " " + UNIT : ""); }
  // Two accents at four strengths, so a key keeps one look as it moves without a third hue.
  var LOOKS = ["139,184,220", "205,133,96"], ALPHA = [0.85, 0.62, 0.45, 0.32];
  function look(key) {
    var h = 0;
    for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return "rgba(" + LOOKS[h & 1] + "," + ALPHA[(h >>> 1) & 3] + ")";
  }
  function short(k) { return /^0x[0-9a-f]{40}$/.test(k) ? k.slice(0, 6) + "…" + k.slice(-4) : k; }

  var chart = $("chart"), rows = {};
  chart.style.height = (TOP * ROW) + "px";
  function rowFor(key) {
    if (rows[key]) return rows[key];
    var r = document.createElement("div"); r.className = "row";
    r.innerHTML = '<span class="rank"></span><span class="label"></span><span class="track"><span class="bar"></span></span><span class="val"></span>';
    r.querySelector(".label").textContent = short(key);
    r.querySelector(".label").title = key;
    r.querySelector(".bar").style.background = look(key);
    r.style.transform = "translateY(" + (TOP * ROW) + "px)";
    chart.appendChild(r);
    rows[key] = r;
    return r;
  }

  var i = 0, playing = false, timer = null, scrub = $("scrub");
  scrub.max = frames.length - 1;

  function draw(n) {
    var f = frames[n], seen = {};
    var vals = f.top.map(function (e) { return scaled(e[1]); });
    var max = Math.max.apply(null, vals.concat([0])) || 1;
    f.top.forEach(function (e, k) {
      var r = rowFor(e[0]); seen[e[0]] = true;
      r.style.opacity = "1";
      r.style.transform = "translateY(" + (k * ROW) + "px)";
      r.querySelector(".rank").textContent = k + 1;
      r.querySelector(".bar").style.width = Math.max(0, vals[k] / max * 100) + "%";
      r.querySelector(".val").textContent = withUnit(vals[k]);
    });
    Object.keys(rows).forEach(function (key) {
      if (!seen[key]) { rows[key].style.opacity = "0"; rows[key].style.transform = "translateY(" + (TOP * ROW) + "px)"; }
    });
    $("date").textContent = f.ts != null ? new Date(f.ts * 1000).toISOString().slice(0, 10) : "block " + f.block.toLocaleString("en-GB");
    $("block").textContent = "block " + f.block.toLocaleString("en-GB");
    $("totals").innerHTML = "";
    var t = document.createElement("span");
    t.textContent = man.fold === "sum" ? withUnit(scaled(f.total)) + " across " : "";
    var c = document.createElement("span"); c.className = "unit";
    c.textContent = f.live.toLocaleString("en-GB") + " " + NOUN;
    $("totals").appendChild(t); $("totals").appendChild(c);
    $("frameno").textContent = (n + 1) + " / " + frames.length;
    $("player").dataset.frame = n;
    scrub.value = n;
  }

  function tick() { if (i >= frames.length - 1) { stop(); return; } i++; draw(i); }
  function start() {
    if (i >= frames.length - 1) i = 0;
    playing = true; $("play").textContent = "Pause";
    timer = setInterval(tick, 1000 / parseInt($("speed").value, 10));
  }
  function stop() { playing = false; $("play").textContent = "Play"; clearInterval(timer); timer = null; }
  $("play").onclick = function () { playing ? stop() : start(); };
  $("speed").onchange = function () { if (playing) { stop(); start(); } };
  scrub.oninput = function () { stop(); i = parseInt(scrub.value, 10); draw(i); };
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); playing ? stop() : start(); }
    else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
      e.preventDefault(); stop();
      i = Math.max(0, Math.min(frames.length - 1, i + (e.code === "ArrowRight" ? 1 : -1))); draw(i);
    }
  });
  var fps = String(man.fps || 30);
  if ([].some.call($("speed").options, function (o) { return o.value === fps; })) $("speed").value = fps;
  var at = /^#f=(\d+)$/.exec(location.hash);
  i = at ? Math.min(parseInt(at[1], 10), frames.length - 1) : 0;
  draw(i);
})();
</script>
</body>
</html>
