<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nuthatch</title>
<style>
  :root {
    --bg: #14110f; --panel: #1b1815; --panel2: #221e1a; --line: #2e2924; --line2: #413a33;
    --fg: #ece5da; --muted: #a2988a; --dim: #766d61;
    --accent: #d0704a; --accent2: #8fa7c4; --good: #7fb069; --warn: #d9a441; --bad: #e0604c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
  a { color: var(--accent2); text-decoration: none; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 6;
  }
  header .logo { font-weight: 700; letter-spacing: .3px; }
  header .logo b { color: var(--accent); }
  header .nest { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  header .grow { flex: 1; }
  .pill {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line2); border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }
  .pill b { color: var(--fg); font-weight: 600; }
  .state { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .6px; padding: 3px 10px; border-radius: 4px; background: var(--line); color: var(--muted); }
  .state.live { background: rgba(127,176,105,.16); color: var(--good); }
  .state.warn { background: rgba(217,164,65,.16); color: var(--warn); }
  .state.bad { background: rgba(224,96,76,.18); color: var(--bad); }
  nav { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; position: sticky; top: 45px; z-index: 5; }
  nav button {
    background: none; border: none; color: var(--muted); font: inherit; padding: 10px 14px;
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  nav button:hover { color: var(--fg); }
  nav button.on { color: var(--fg); border-bottom-color: var(--accent); }
  main { padding: 20px; }
  h2 { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
  .stat .k { color: var(--muted); font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-family: var(--mono); font-size: 18px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat .s { color: var(--dim); font-family: var(--mono); font-size: 11px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat svg { display: block; width: 100%; height: 28px; margin-top: 6px; }
  .stat.good .v { color: var(--good); } .stat.warn .v { color: var(--warn); } .stat.bad .v { color: var(--bad); }
  .cols { display: flex; gap: 16px; align-items: flex-start; }
  .side { width: 290px; flex: none; position: sticky; top: 100px; }
  .rest { flex: 1; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
  .card > h3 { margin: 0; padding: 8px 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .card > h3 .grow { flex: 1; }
  .card .pad { padding: 12px; }
  .list { list-style: none; margin: 0; padding: 4px; max-height: calc(100vh - 210px); overflow: auto; }
  .list li { padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: var(--mono); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; }
  .list li:hover { background: var(--line); }
  .list li.on { background: var(--line2); }
  .list li .n { color: var(--dim); white-space: nowrap; }
  .list li.group { color: var(--accent2); cursor: default; padding-top: 9px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .list li.group:hover { background: none; }
  .list li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; }
  .scroll { overflow: auto; max-height: 62vh; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-weight: 600; z-index: 1; cursor: pointer; user-select: none; }
  td.num, th.num { text-align: right; }
  tr:hover td { background: rgba(255,255,255,.025); }
  tr.click { cursor: pointer; }
  td.wrap { white-space: pre-wrap; max-width: none; word-break: break-all; }
  input[type=text], textarea, select {
    background: #0e0c0a; color: var(--fg); border: 1px solid var(--line2); border-radius: 5px;
    padding: 7px 10px; font-family: var(--mono); font-size: 12.5px;
  }
  input[type=text]:focus, textarea:focus { outline: 1px solid var(--accent2); }
  textarea { width: 100%; min-height: 150px; resize: vertical; line-height: 1.45; tab-size: 2; }
  .btn { background: var(--accent); color: #14110f; border: none; border-radius: 5px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line2); font-weight: 400; }
  .btn.ghost:hover { background: var(--line); }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .err { color: var(--bad); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; padding: 10px 12px; }
  .note { color: var(--warn); font-family: var(--mono); font-size: 12px; padding: 6px 12px; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 12px; }
  code, pre { font-family: var(--mono); font-size: 12px; }
  code { background: var(--line); padding: 1px 5px; border-radius: 3px; }
  pre { margin: 0; padding: 12px; overflow: auto; max-height: 70vh; line-height: 1.5; white-space: pre; }
  .empty { color: var(--dim); padding: 22px; text-align: center; font-size: 12.5px; }
  .tag { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 5px; color: var(--muted); }
  .tag.good { color: var(--good); border-color: rgba(127,176,105,.4); }
  .tag.bad { color: var(--bad); border-color: rgba(224,96,76,.4); }
  .tag.warn { color: var(--warn); border-color: rgba(217,164,65,.4); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; font-family: var(--mono); font-size: 12px; padding: 12px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .kv div:nth-child(even) { word-break: break-all; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent2); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line2); border-radius: 4px; padding: 2px 8px; cursor: pointer; color: var(--muted); background: none; }
  .chip:hover, .chip.on { color: var(--fg); background: var(--line); }
  @media (max-width: 900px) {
    .cols { flex-direction: column; } .side { width: 100%; position: static; } .list { max-height: 240px; }
    header, nav { position: static; } header { padding: 10px 12px; gap: 8px; } main { padding: 12px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat .v { font-size: 15px; }
    .kv { grid-template-columns: 1fr; gap: 0; } .kv div:nth-child(even) { margin-bottom: 8px; }
    nav button { padding: 10px 11px; } textarea, input[type=text] { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <span class="logo"><b>nuthatch</b></span>
  <span class="state" id="state">CONNECTING</span>
  <span class="nest" id="nest"></span>
  <span class="grow"></span>
  <span class="pill">tip <b id="p-tip">-</b></span>
  <span class="pill">indexed <b id="p-idx">-</b></span>
  <span class="pill">sealed <b id="p-sealed">-</b></span>
  <span class="pill">lag <b id="p-lag">-</b></span>
  <span class="pill" id="p-ver">-</span>
</header>
<nav id="nav">
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="tables">Tables</button>
  <button data-tab="sql">SQL</button>
  <button data-tab="entities">Entities</button>
  <button data-tab="storage">Storage</button>
  <button data-tab="rpc">RPC &amp; ingest</button>
  <button data-tab="config">Config</button>
  <button data-tab="raw">Raw</button>
</nav>
<main>
  <section id="tab-overview"></section>

  <section id="tab-tables" hidden>
    <div class="cols">
      <div class="side card">
        <h3>Tables <span class="grow"></span><span id="tcount" class="dim"></span></h3>
        <div class="pad" style="padding:8px"><input type="text" id="tfilter" placeholder="filter" style="width:100%"></div>
        <ul class="list" id="tablist"><li class="empty">loading</li></ul>
      </div>
      <div class="rest" id="tabledetail"><div class="empty">Pick a table.</div></div>
    </div>
  </section>

  <section id="tab-sql" hidden>
    <div class="cols">
      <div class="rest">
        <textarea id="q" spellcheck="false" placeholder='SELECT * FROM "alias__event" ORDER BY block_number DESC LIMIT 20'></textarea>
        <div class="toolbar">
          <button class="btn" id="run">Run</button>
          <button class="btn ghost" id="explain">Check</button>
          <button class="btn ghost" id="save">Save</button>
          <span class="muted" id="sqlmeta"></span>
          <span class="grow" style="flex:1"></span>
          <button class="btn ghost small" id="csv" hidden>CSV</button>
          <button class="btn ghost small" id="jsonl" hidden>JSON</button>
        </div>
        <div id="sqlaccess"></div>
        <div class="card"><div class="scroll" id="sqlrows"><div class="empty">Read-only. Ctrl or Cmd + Enter runs. Quote table names; big-int columns have a <code>_dec</code> companion for arithmetic.</div></div></div>
        <div class="card" id="provcard" hidden><h3>Provenance</h3><div class="kv" id="prov"></div></div>
      </div>
      <div class="side">
        <div class="card"><h3>Named queries</h3><ul class="list" id="named" style="max-height:180px"></ul></div>
        <div class="card"><h3>Saved here</h3><ul class="list" id="saved" style="max-height:180px"></ul></div>
        <div class="card"><h3>History</h3><ul class="list" id="hist" style="max-height:220px"></ul></div>
        <div class="card"><h3>Schema</h3>
          <div class="pad" style="padding:8px"><input type="text" id="sfilter" placeholder="filter tables" style="width:100%"></div>
          <ul class="list" id="schemalist" style="max-height:300px"></ul></div>
      </div>
    </div>
  </section>

  <section id="tab-entities" hidden></section>
  <section id="tab-storage" hidden></section>
  <section id="tab-rpc" hidden></section>
  <section id="tab-config" hidden></section>
  <section id="tab-raw" hidden></section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Everything is fetched relative to where this page is served, so a nest under a runtime prefix
// or behind a proxy path talks to itself and not to whatever answers at the proxy's root.
const BASE = location.pathname.replace(/_admin\/?$/, '');
const TOKEN = new URLSearchParams(location.search).get('token');
const withToken = p => TOKEN && p.startsWith('_admin') ? p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : p;
async function raw(p){ return fetch(BASE + withToken(p)); }
// A nest answers some states with a JSON body and a non-200 (a stalled /ready is a 503), so the
// body is read whatever the status.
async function api(p){
  const r = await raw(p);
  const text = await r.text();
  try { const j = JSON.parse(text); if (j && typeof j === 'object') j.__status = r.status; return j; }
  catch (_) { throw new Error(p + ' answered ' + r.status + (text ? ': ' + text.slice(0, 200) : '')); }
}
const num = n => (n === null || n === undefined || n === '') ? '-' : (isFinite(+n) ? (+n).toLocaleString('en-US') : String(n));
function bytes(n){
  if (n === null || n === undefined || !isFinite(+n)) return '-';
  n = +n; const u = ['B','KiB','MiB','GiB','TiB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + ' ' + u[i];
}
function span(secs){
  if (secs === null || secs === undefined || !isFinite(+secs)) return '-';
  secs = Math.round(+secs);
  if (secs < 90) return secs + 's';
  if (secs < 5400) return Math.round(secs / 60) + 'm';
  if (secs < 129600) return (secs / 3600).toFixed(1) + 'h';
  return (secs / 86400).toFixed(1) + 'd';
}
const short = (s, n = 10) => { s = String(s ?? ''); return s.length > 2 * n + 3 ? s.slice(0, n) + '…' + s.slice(-n) : s; };
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem('nuthatch:' + BASE + ':' + k)) ?? d; } catch (_) { return d; } },
  set(k, v){ try { localStorage.setItem('nuthatch:' + BASE + ':' + k, JSON.stringify(v)); } catch (_) {} },
};

// ---- state shared by the tabs ----
const S = { ready: null, summary: null, metrics: null, nest: null, tables: null, storage: null, queries: null, samples: [] };
let tab = 'overview';
const TABS = ['overview','tables','sql','entities','storage','rpc','config','raw'];
function show(t){
  tab = t;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  TABS.forEach(x => $('#tab-' + x).hidden = x !== t);
  if (location.hash.slice(1).split('/')[0] !== t) history.replaceState(null, '', '#' + t);
  ({ overview: renderOverview, tables: loadTables, sql: loadSql, entities: loadEntities, storage: loadStorage, rpc: renderRpc, config: loadConfig, raw: loadRaw })[t]();
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => show(b.dataset.tab));

// ---- prometheus text ----
function parseMetrics(text){
  const m = {};
  for (const line of text.split('\n')) {
    if (!line || line[0] === '#') continue;
    const sp = line.lastIndexOf(' ');
    const head = line.slice(0, sp), value = parseFloat(line.slice(sp + 1));
    const brace = head.indexOf('{');
    const name = brace < 0 ? head : head.slice(0, brace);
    const labels = {};
    if (brace >= 0) for (const part of head.slice(brace + 1, -1).matchAll(/([a-zA-Z_]+)="((?:[^"\\]|\\.)*)"/g)) labels[part[1]] = part[2];
    (m[name] ||= []).push({ labels, value });
  }
  return m;
}
const mv = name => { const v = S.metrics && S.metrics[name]; return v && v.length ? v.find(x => !Object.keys(x.labels).length)?.value ?? v[0].value : null; };
const ml = name => (S.metrics && S.metrics[name]) || [];

// ---- polling ----
async function tick(pushed){
  try {
    const [ready, summary, mtext] = await Promise.all([api('ready'), pushed || api(''), raw('metrics').then(r => r.text())]);
    S.ready = ready; S.summary = summary; S.metrics = parseMetrics(mtext);
    S.samples.push({
      t: Date.now() / 1000, block: +ready.last_block || 0,
      rpc: mv('nuthatch_rpc_requests_total') || 0, rows: mv('nuthatch_rows_decoded_total') || 0,
      http: mv('nuthatch_http_requests_total') || 0, sqlq: mv('nuthatch_sql_queries_total') || 0,
      cpu: mv('nuthatch_process_cpu_seconds_total') || 0, rss: mv('nuthatch_rss_bytes') || 0,
    });
    if (S.samples.length > 180) S.samples.shift();
    S.down = null;
  } catch (e) { S.down = e.message; }
  renderHeader();
  if (tab === 'overview') renderOverview();
  if (tab === 'rpc') renderRpc();
}
function nestState(){
  const r = S.ready;
  if (S.down || !r) return ['STALE', 'bad'];
  if (r.wedged) return ['WEDGED', 'bad'];
  if (r.stalled || r.seal_direct_stalled || r.tip_seal_stalled || r.entities_stalled) return ['ATTENTION', 'warn'];
  if (r.seal_direct_active) return ['BACKFILL', 'warn'];
  if (r.cursorless) return ['SERVING', 'live'];
  return r.ready ? ['LIVE', 'live'] : ['NOT READY', 'warn'];
}
function renderHeader(){
  const [label, cls] = nestState();
  const st = $('#state'); st.textContent = label; st.className = 'state ' + cls;
  const r = S.ready || {}, s = S.summary || {};
  const name = (S.nest && S.nest.name) || s.name || '';
  $('#nest').textContent = [name, s.chain].filter(Boolean).join(' · ');
  if (name) document.title = name + ' · nuthatch';
  $('#p-tip').textContent = num(r.tip);
  $('#p-idx').textContent = num(r.last_block);
  $('#p-sealed').textContent = num(r.sealed_through);
  $('#p-lag').textContent = r.lag_blocks === null || r.lag_blocks === undefined ? '-' : num(r.lag_blocks) + ' blk';
  $('#p-ver').textContent = r.version ? 'v' + r.version : '-';
}

// rate of a counter over the last `window` seconds of samples
function rate(key, windowSecs = 60){
  const a = S.samples; if (a.length < 2) return null;
  const last = a[a.length - 1]; let first = a[0];
  for (const s of a) if (last.t - s.t <= windowSecs) { first = s; break; }
  const dt = last.t - first.t; if (dt <= 0) return null;
  const d = last[key] - first[key];
  return d < 0 ? null : d / dt;
}
function spark(key, delta = true){
  const a = S.samples; if (a.length < 3) return '';
  const pts = [];
  for (let i = 1; i < a.length; i++) pts.push(delta ? Math.max(0, a[i][key] - a[i - 1][key]) : a[i][key]);
  const max = Math.max(...pts, 1e-9), w = 100, h = 28, step = w / Math.max(1, pts.length - 1);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + (i * step).toFixed(1) + ' ' + (h - 2 - (p / max) * (h - 4)).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent2)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>`;
}
const stat = (k, v, sub = '', cls = '', extra = '') =>
  `<div class="stat ${cls}"><div class="k">${esc(k)}</div><div class="v" title="${esc(v)}">${esc(v)}</div>${sub ? `<div class="s" title="${esc(sub)}">${esc(sub)}</div>` : ''}${extra}</div>`;
const fixed = (n, d = 1) => n === null ? '-' : n.toFixed(n >= 100 ? 0 : d);

// ---- overview ----
function renderOverview(){
  const el = $('#tab-overview');
  if (S.down && !S.ready) { el.innerHTML = `<div class="err">The nest is not answering: ${esc(S.down)}</div>`; return; }
  const r = S.ready, s = S.summary;
  if (!r || !s) { el.innerHTML = '<div class="empty">loading</div>'; return; }
  const [label, cls] = nestState();
  const f = r.freshness || {};
  let h = S.down ? `<div class="err">Last poll failed (${esc(S.down)}). Figures below are the last received.</div>` : '';
  const flags = [['stalled', r.stalled], ['wedged', r.wedged], ['initial poll failed', r.initial_poll_failed], ['backfill stalled', r.seal_direct_stalled], ['tip seal stalled', r.tip_seal_stalled], ['entities stalled', r.entities_stalled]].filter(x => x[1]).map(x => x[0]);
  h += '<h2>Health</h2><div class="grid">';
  h += stat('state', label, flags.join(', ') || (r.cursorless ? 'serves, does not index' : 'no faults reported'), cls === 'live' ? 'good' : cls);
  h += stat('tip', num(r.tip), r.cursorless ? 'no cursor' : 'chain head seen');
  h += stat('indexed', num(r.last_block), r.lag_blocks == null ? '' : num(r.lag_blocks) + ' blocks behind', '', spark('block'));
  h += stat('sealed through', num(r.sealed_through), r.seal_lag_blocks == null ? '' : num(r.seal_lag_blocks) + ' blocks hot');
  h += stat('last poll', r.seconds_since_poll == null ? '-' : span(r.seconds_since_poll) + ' ago', f.poll_interval_secs ? 'every ' + span(f.poll_interval_secs) + ' (' + (f.poll_interval_source || '') + ')' : '');
  h += stat('freshness', f.mode || '-', r.seconds_since_seal_progress == null ? '' : 'seal progress ' + span(r.seconds_since_seal_progress) + ' ago');
  h += stat('reorgs', num(mv('nuthatch_reorgs_total')), 'since start');
  h += '</div>';

  if (r.seal_direct_active || r.seal_direct_target) {
    const done = +r.seal_direct_completed || 0, origin = +r.seal_direct_origin || 0, target = +r.seal_direct_target || 0;
    const pct = target > origin ? Math.min(100, Math.max(0, (done - origin) / (target - origin) * 100)) : 0;
    const c = r.seal_direct_concurrency || {};

// ---- generic sortable grid ----
function grid(cols, rows, opts = {}){
  if (!rows || !rows.length) return `<div class="empty">${esc(opts.empty || 'no rows')}</div>`;
  const id = 'g' + Math.random().toString(36).slice(2);
  grid.reg[id] = { cols, rows, opts, sort: null, dir: 1 };
  return `<table id="${id}">${gridInner(id)}</table>`;
}
grid.reg = {};
function gridInner(id){
  const g = grid.reg[id];
  let rows = g.rows;
  if (g.sort !== null) {
    const c = g.cols[g.sort];
    rows = rows.slice().sort((a, b) => {
      const x = cellRaw(c, a), y = cellRaw(c, b);
      const nx = parseFloat(x), ny = parseFloat(y);
      const both = isFinite(nx) && isFinite(ny) && String(x).trim() !== '' && String(y).trim() !== '';
      return (both ? nx - ny : String(x ?? '').localeCompare(String(y ?? ''))) * g.dir;
    });
  }
  const head = '<tr>' + g.cols.map((c, i) => `<th class="${c.num ? 'num' : ''}" data-i="${i}">${esc(c.label ?? c.key)}${g.sort === i ? (g.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>';
  const body = rows.map((r, ri) => `<tr${g.opts.click ? ` class="click" data-k="${esc(g.opts.click.key(r))}"` : ''}>` + g.cols.map(c => {
    const v = c.fmt ? c.fmt(cellRaw(c, r), r) : cellRaw(c, r);
    // Only the page's own formatters may emit markup: a named tuple in /table arrives as an object (#2219).
    const trusted = c.fmt && v && typeof v === 'object' && 'html' in v;
    const text = v === null || v === undefined ? '' : (typeof v === 'object' && !trusted ? JSON.stringify(v) : v);
    return trusted ? `<td class="${c.num ? 'num' : ''}">${v.html}</td>` : `<td class="${c.num ? 'num' : ''}" title="${esc(text)}">${esc(text)}</td>`;
  }).join('') + '</tr>').join('');
  return `<thead>${head}</thead><tbody>${body}</tbody>`;
}
const cellRaw = (c, r) => r[c.key];
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-i]');
  if (th) {
    const t = th.closest('table'), g = grid.reg[t.id]; if (!g) return;
    const i = +th.dataset.i;
    if (g.sort === i) g.dir = -g.dir; else { g.sort = i; g.dir = 1; }
    t.innerHTML = gridInner(t.id);
    return;
  }
  const tr = e.target.closest('tr.click');
  if (tr) { const g = grid.reg[tr.closest('table').id]; if (g && g.opts.click) g.opts.click.go(tr.dataset.k); }
});
const colsOf = items => [...new Set(items.flatMap(r => Object.keys(r)))].map(k => ({ key: k }));

// ---- tables ----
let curTable = null;
async function ensureTables(){

  return S.tables;
}
const sealedOf = t => (S.storage?.tables || []).find(x => x.table === t);
function tableList(target, filter, onpick, current){
  const f = filter.trim().toLowerCase();
  const groups = {};
  for (const t of S.tables) {
    if (f && !t.table.toLowerCase().includes(f)) continue;
    (groups[t.alias || 'other'] ||= []).push(t);
  }
  let h = '';
  for (const [alias, ts] of Object.entries(groups)) {
    h += `<li class="group"><span>${esc(alias)}</span><span class="n">${ts.length}</span></li>`;
    for (const t of ts) {
      const st = sealedOf(t.table);
      const label = t.table.startsWith(alias + '__') ? t.table.slice(alias.length + 2) : t.table;
      h += `<li data-t="${esc(t.table)}" class="${t.table === current ? 'on' : ''}"><span>${esc(label)}</span><span class="n">${st ? num(st.rows) : ''}</span></li>`;
    }
  }
  target.innerHTML = h || '<li class="empty">no tables match</li>';
  target.querySelectorAll('li[data-t]').forEach(li => li.onclick = () => onpick(li.dataset.t));
}

let lastResult = null, sqlReady = false;
async function loadSql(){

  const qs = S.queries;
  $('#sqlaccess').innerHTML = qs.free_form === false ? '<div class="note">This nest has closed free-form SQL. Only its named queries run.</div>' : '';
  $('#named').innerHTML = (qs.queries || []).map(q => `<li data-n="${esc(q.name)}"><span>${esc(q.name)}</span><span class="n">${esc((q.params || []).join(', '))}</span></li>`).join('') || '<li class="empty">none declared</li>';
  $('#named').querySelectorAll('li[data-n]').forEach(li => li.onclick = () => runNamed((qs.queries || []).find(q => q.name === li.dataset.n)));
  const drawSchema = () => tableList($('#schemalist'), $('#sfilter').value, name => {
    const t = S.tables.find(x => x.table === name);
    insert(`SELECT ${t.columns.filter(c => c.sol_type !== 'implicit').map(c => '"' + c.name + '"').join(', ') || '*'}, block_number\nFROM "${name}"\nORDER BY block_number DESC\nLIMIT 50`, true);
  }, null);

function insert(text, replace){ const q = $('#q'); q.value = replace || !q.value.trim() ? text : q.value + '\n' + text; store.set('draft', q.value); q.focus(); }

function showResult(d, ms, what){

  }
  const rows = d.rows || d.items || [];
  // The degraded and tip caveats ride in the same line as the count (#435, #472): without them a

async function checkSql(){

function download(kind){

  el.innerHTML = '<div class="empty">loading</div>';
  try {
    const d = await api('_admin/storage');
    if (d.error) throw new Error(d.error);
    S.storage = d;
    const ts = d.tables || [];
    const sum = k => ts.reduce((a, t) => a + (+t[k] || 0), 0);
    const small = ts.filter(t => t.segments).reduce((a, t) => a + t.provisional, 0);
    let h = '<h2>Sealed catalogue</h2><div class="grid">'
      + stat('tables sealed', num(ts.filter(t => t.segments).length), 'of ' + num(S.summary?.tables))
      + stat('segments', num(sum('segments')), small + ' provisional')
      + stat('sealed rows', num(sum('rows')))
      + stat('sealed bytes', bytes(sum('bytes')), sum('rows') ? Math.round(sum('bytes') / sum('rows')) + ' B per row' : '')
      + stat('hot store', bytes(mv('nuthatch_hot_store_bytes')), num(S.summary?.entities) + ' hot rows')
      + stat('missing files', num(sum('missing_files')), 'named in the catalogue, not on disk', sum('missing_files') ? 'bad' : 'good')
      + stat('catalogue', 'v' + d.manifest_version)
      + '</div>';
    h += '<h2>Per table</h2><div class="card"><div class="scroll" style="max-height:none">' + grid([
      { key: 'table' }, { key: 'segments', num: 1, fmt: num }, { key: 'provisional', num: 1, fmt: v => v || '' },
      { key: 'rows', num: 1, fmt: num }, { key: 'bytes', num: 1, fmt: bytes },
      { key: 'from_block', label: 'from', num: 1, fmt: num }, { key: 'to_block', label: 'to', num: 1, fmt: num },
      { key: 'missing_files', label: 'missing', num: 1, fmt: v => v || '' },
    ], ts, { empty: 'Nothing has sealed yet. Rows seal once they are past finality.', click: { key: r => r.table, go: t => { location.hash = '#tables/' + encodeURIComponent(t); show('tables'); } } }) + '</div></div>';
    el.innerHTML = h;
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// ---- rpc & ingest ----
// Units a provider bills per call and what a million of them cost: published schedules as of
// 2026-10. Every figure is editable on the page, because none of them stays put.
const PRICE_PRESETS = {
  none: { label: 'not priced', per_million: 0, units: {}, other: 0 },
  graphops_growth: { label: 'GraphOps Growth ($199 / 10M credits)', per_million: 19.9, units: { eth_getLogs: 2, eth_call: 2 }, other: 1 },
  graphops_starter: { label: 'GraphOps Starter ($39 / 1.5M credits)', per_million: 26, units: { eth_getLogs: 2, eth_call: 2 }, other: 1 },
  alchemy: { label: 'Alchemy pay as you go ($0.45 / 1M CU)', per_million: 0.45, units: { eth_getBlockByNumber: 20, eth_getLogs: 60, eth_blockNumber: 10, eth_call: 26, eth_chainId: 0 }, other: 20 },
};
const pricePreset = k => ({ preset: k, per_million: PRICE_PRESETS[k].per_million, units: { ...PRICE_PRESETS[k].units }, other: PRICE_PRESETS[k].other });
function priceSchedule(busiest){
  const saved = store.get('price', null);
  if (saved && isFinite(+saved.per_million) && saved.units) return saved;
  return pricePreset(/graphops/.test(busiest) ? 'graphops_growth' : /alchemy/.test(busiest) ? 'alchemy' : 'none');
}
const unitsFor = (p, m) => +(p.units[m] ?? p.other) || 0;
const usd = v => v === null || !isFinite(v) ? '-' : v === 0 ? '$0' : '$' + (v >= 100 ? Math.round(v).toLocaleString('en-US') : v >= 1 ? v.toFixed(2) : v >= 0.01 ? v.toFixed(3) : v.toFixed(4));
function priceEditor(p, methods){
  const names = [...new Set([...methods.map(x => x.method), ...Object.keys(p.units)])].sort();
  const box = (attr, v, w) => `<input type="text" ${attr} value="${esc(v)}" style="width:${w}px;padding:3px 6px">`;
  return '<h2>Price</h2><div class="card" style="padding:10px 12px"><div class="chips" style="align-items:center;gap:10px">'
    + `<select id="pr-preset">${Object.entries(PRICE_PRESETS).map(([k, x]) => `<option value="${k}"${k === p.preset ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}${p.preset === 'custom' ? '<option value="custom" selected>your own figures</option>' : ''}</select>`
    + `<label>$ per million units ${box('id="pr-rate"', p.per_million, 70)}</label>`
    + names.map(m => `<label>${esc(m)} ${box(`data-m="${esc(m)}"`, unitsFor(p, m), 46)}</label>`).join('')
    + `<label>any other ${box('id="pr-other"', p.other, 46)}</label>`
    + '</div></div><p class="hint">Approximate. Calls since this process started, multiplied by the units each costs; every call is priced as if it went to this provider. The presets are published prices as of October 2026, so check them against your own plan. Your figures are kept in this browser only.</p>';
}
function renderRpc(force){
  const el = $('#tab-rpc');
  if (!S.metrics) { el.innerHTML = '<div class="empty">loading</div>'; return; }
  const r = S.ready || {};
  const by = (name, label) => Object.fromEntries(ml(name).filter(x => x.labels[label]).map(x => [x.labels[label], x.value]));
  const req = by('nuthatch_rpc_endpoint_requests_total', 'endpoint'), fail = by('nuthatch_rpc_endpoint_failures_total', 'endpoint'), retry = by('nuthatch_rpc_endpoint_retries_total', 'endpoint');
  const dc = by('nuthatch_rpc_request_duration_seconds_count', 'endpoint'), ds = by('nuthatch_rpc_request_duration_seconds_sum', 'endpoint');
  const eps = [...new Set([...Object.keys(req), ...Object.keys(fail), ...Object.keys(retry)])].map(e => ({
    endpoint: e, requests: req[e] || 0, failures: fail[e] || 0, retries: retry[e] || 0,
    failure_rate: req[e] ? ((fail[e] || 0) / req[e] * 100).toFixed(2) + '%' : '-', avg_ms: dc[e] ? Math.round(ds[e] / dc[e] * 1000) : null,
  }));
  const methods = ml('nuthatch_rpc_methods_total').map(x => ({ method: x.labels.method || Object.values(x.labels).join(' '), calls: x.value }));
  const price = priceSchedule(eps.slice().sort((a, b) => b.requests - a.requests)[0]?.endpoint || '');
  const priced = price.preset !== 'none';
  for (const x of methods) { x.each = unitsFor(price, x.method); x.units = x.calls * x.each; x.usd = x.units / 1e6 * price.per_million; }
  const units = methods.reduce((a, x) => a + x.units, 0), spent = units / 1e6 * price.per_million;
  const started = mv('nuthatch_start_time_seconds'), up = started ? Date.now() / 1000 - started : null;
  const buckets = ml('nuthatch_rpc_request_duration_seconds_bucket');
  const c = r.seal_direct_concurrency || {};
  let h = '<h2>Outbound RPC</h2><div class="grid">'
    + stat('requests', num(mv('nuthatch_rpc_requests_total')), fixed(rate('rpc')) + ' req/s over the last minute', '', spark('rpc'))
    + stat('fetch window', num(r.fetch_window_blocks ?? mv('nuthatch_fetch_window_blocks')), 'blocks per getLogs')
    + stat('concurrency', num(c.effective) + ' of ' + num(c.requested), c.capped_by || 'not capped')
    + stat('indexed blocks', fixed(rate('block')) + '/s', 'over the last minute', '', spark('block'))
    + stat('cost since start', priced ? '~' + usd(spent) : '-', priced ? num(units) + ' units' + (up > 0 ? ' in ' + span(up) : '') : 'choose a schedule under Price')
    + stat('at this rate', priced && up > 0 ? '~' + usd(spent / up * 2592000) + ' / 30d' : '-', !priced ? 'not priced' : up > 0 ? 'projected from ' + span(up) + ' of running' : 'this nest does not report its start time')
    + '</div>';
  h += '<h2>Endpoints</h2><div class="card"><div class="scroll">' + grid([
    { key: 'endpoint' }, { key: 'requests', num: 1, fmt: num }, { key: 'failures', num: 1, fmt: num }, { key: 'retries', num: 1, fmt: num },
    { key: 'failure_rate', label: 'failure rate', num: 1 }, { key: 'avg_ms', label: 'avg ms', num: 1, fmt: num },
  ], eps, { empty: 'no endpoint has been called yet' }) + '</div></div>';
  h += '<h2>Methods</h2><div class="card"><div class="scroll">' + grid([{ key: 'method' }, { key: 'calls', num: 1, fmt: num },
    ...(priced ? [{ key: 'each', label: 'units each', num: 1, fmt: num }, { key: 'units', num: 1, fmt: num }, { key: 'usd', label: 'approx usd', num: 1, fmt: usd }] : []),
  ], methods, { empty: 'no calls yet' }) + '</div></div>';
  const top = h; h = '';
  if (buckets.length) {
    let prev = 0;
    const rows = buckets.filter(b => !b.labels.endpoint || Object.keys(dc).length <= 1 || true).reduce((acc, b) => { const k = b.labels.le; (acc[k] ||= 0); acc[k] += b.value; return acc; }, {});
    const hist = Object.entries(rows).sort((a, b) => (a[0] === '+Inf' ? Infinity : +a[0]) - (b[0] === '+Inf' ? Infinity : +b[0])).map(([le, cum]) => { const n = cum - prev; prev = cum; return { up_to: le === '+Inf' ? 'slower' : le + ' s', requests: n }; });
    h += '<h2>Latency</h2><div class="card"><div class="scroll">' + grid([{ key: 'up_to', label: 'up to' }, { key: 'requests', num: 1, fmt: num }], hist) + '</div></div>';
  }
  const rej = ml('nuthatch_sql_rejections_total').filter(x => Object.keys(x.labels).length).map(x => ({ reason: Object.values(x.labels).join(' '), refused: x.value }));
  h += '<h2>SQL refusals</h2><div class="card"><div class="scroll">' + grid([{ key: 'reason' }, { key: 'refused', num: 1, fmt: num }], rej, { empty: 'none' }) + '</div></div>';
  const ipfs = Object.keys(S.metrics).filter(k => k.startsWith('nuthatch_ipfs_')).map(k => ({ counter: k.replace('nuthatch_ipfs_', '').replace('_total', ''), value: mv(k) }));
  if (ipfs.some(x => x.value)) h += '<h2>IPFS</h2><div class="card"><div class="scroll">' + grid([{ key: 'counter' }, { key: 'value', num: 1, fmt: num }], ipfs) + '</div></div>';
  if (!$('#rpc-price')) el.innerHTML = '<div id="rpc-top"></div><div id="rpc-price"></div><div id="rpc-rest"></div>';
  $('#rpc-top').innerHTML = top; $('#rpc-rest').innerHTML = h;
  const pe = $('#rpc-price');
  // Redrawn on every tick otherwise, which takes the field out from under whoever is typing in it.
  if (!force && pe.contains(document.activeElement)) return;
  pe.innerHTML = priceEditor(price, methods);
  const save = p => { store.set('price', p); renderRpc(true); };
  $('#pr-preset').onchange = e => save(pricePreset(e.target.value));
  const edit = fn => e => { const v = parseFloat(e.target.value); if (isFinite(v) && v >= 0) { const p = { ...price, units: { ...price.units }, preset: 'custom' }; fn(p, v, e.target); save(p); } else renderRpc(true); };
  $('#pr-rate').onchange = edit((p, v) => p.per_million = v);
  $('#pr-other').onchange = edit((p, v) => p.other = v);
  pe.querySelectorAll('input[data-m]').forEach(i => i.onchange = edit((p, v, t) => p.units[t.dataset.m] = v));
}


// ---- config ----
let curFile = 0;
async function loadConfig(){
  const el = $('#tab-config');
  el.innerHTML = '<div class="empty">loading</div>';
  try {
    const [cfg, nest] = await Promise.all([api('_admin/config'), S.nest ? S.nest : api('nest')]);
    S.nest = nest;
    const r = S.ready || {}, f = r.freshness || {}, run = cfg.running || {}, sql = run.sql || {};
    let h = '<h2>Running with</h2><div class="card"><div class="kv">'
      + [['version', run.version], ['chain', run.chain + (nest.chain_id ? ' (' + nest.chain_id + ')' : '')], ['role', run.cursorless ? 'serve only, no cursor' : 'indexing'],
         ['freshness', (f.mode || '-') + (f.poll_interval_secs ? ', poll every ' + span(f.poll_interval_secs) + ' (' + f.poll_interval_source + ')' : '')],
         ['fetch window', num(r.fetch_window_blocks) + ' blocks'], ['seal span', num(run.seal_span) + ' blocks'], ['seal table floor', num(run.seal_table_floor) + ' rows'],
         ['sql concurrency', num(sql.max_concurrency) + ' running, ' + num(sql.max_queued) + ' queued'], ['sql row cap', num(sql.max_rows) + ' rows returned'],
         ['sql hot scan cap', num(sql.max_hot_rows) + ' rows or ' + bytes(sql.max_hot_bytes)], ['named scan cap', bytes(sql.max_named_scan_bytes)], ['query length cap', bytes(sql.max_query_len)],
         ['free-form sql', S.queries ? (S.queries.free_form ? 'open' : 'closed') : '-'],
        ].map(([k, v]) => `<div>${esc(k)}</div><div>${esc(v ?? '-')}</div>`).join('') + '</div></div>';
    const tbl = (title, rows, cols) => rows && rows.length ? `<h2>${title}</h2><div class="card"><div class="scroll">${grid(cols.map(k => ({ key: k })), rows)}</div></div>` : '';
    h += tbl('Contracts', nest.contracts, ['alias', 'address']);
    h += tbl('Templates', nest.templates, ['name', 'abi']);
    h += tbl('Factories', nest.factories, ['watch', 'event', 'child_param', 'template']);
    h += tbl('Webhooks', nest.webhooks, ['name', 'table', 'target', 'finality']);
    const files = cfg.files || [];
    if (curFile >= files.length) curFile = 0;
    h += '<h2>Authored files</h2>';
    if (!files.length) h += '<div class="empty">No authored files could be read from the nest directory.</div>';
    else h += `<div class="chips" style="margin-bottom:8px">${files.map((x, i) => `<button class="chip ${i === curFile ? 'on' : ''}" data-f="${i}">${esc(x.name)}</button>`).join('')}</div><div class="card"><pre id="filetext">${esc(files[curFile].text)}</pre></div><p class="hint">Read from disk now, so an edit shows here before the restart that applies it. URLs are cut to their host and secrets are withheld. This page does not write; edit the files and restart the nest.</p>`;
    el.innerHTML = h;
    el.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => { curFile = +b.dataset.f; loadConfig(); });
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// ---- raw ----
let rawWhat = 'ready';
async function loadRaw(){
  const el = $('#tab-raw');
  const what = ['ready', 'summary', 'nest', 'schema', 'metrics', 'queries', 'derived', 'shape', 'flags'];
  const path = { summary: '' }[rawWhat] ?? rawWhat;
  el.innerHTML = `<div class="chips" style="margin-bottom:8px">${what.map(w => `<button class="chip ${w === rawWhat ? 'on' : ''}" data-w="${w}">${w === 'summary' ? '/' : '/' + w}</button>`).join('')}</div><div class="card"><pre id="rawtext">loading</pre></div>`;
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => { rawWhat = b.dataset.w; loadRaw(); });
  try {
    const r = await raw(path); const text = await r.text();
    let out = text; try { out = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
    $('#rawtext').textContent = out;
  } catch (e) { $('#rawtext').textContent = e.message; }
}

// ---- start ----
api('nest').then(n => { S.nest = n; renderHeader(); }).catch(() => {});
const first = location.hash.slice(1).split('/')[0];
show(TABS.includes(first) ? first : 'overview');
// The summary is server-pushed, and each frame is the cue to read the rest. If the stream cannot
// connect (a proxy that buffers, a browser without EventSource) the page polls instead.
let polling = null;
function startPolling(){
  if (polling) return;
  polling = setInterval(() => { if (!document.hidden) tick(); }, 2000);
  tick();
}
(function startLive(){
  if (!('EventSource' in window)) { startPolling(); return; }
  let es;
  try { es = new EventSource(BASE + withToken('_admin/events')); } catch (_) { startPolling(); return; }
  es.onmessage = e => { if (document.hidden) return; try { tick(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { es.close(); startPolling(); };
  tick();
})();
</script>
