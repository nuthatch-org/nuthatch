# Story lines for Lodestar's allocations nest (graph-allocations-nest, Arbitrum One), written for
# RFC-0071 §17's gate. Merge the `story` keys into the nest's own semantic.toml, or use this file as it
# stands: `nuthatch diff` reads only the story lines, and semantic.toml is outside the data identity,
# so either way the nest is not re-indexed.
#
# Every GRT amount names the token by address, so `metadata.json` supplies its decimals when
# `nuthatch metadata fetch` has cached them, and the diff prints base units with "(decimals unknown)"
# when it has not. The six call tables and l1_blocks have no story and are grouped.
schema_version = 1

[table.curation__burned]
story = "{curator} burned {signal} signal on {subgraphDeploymentID} for {tokens:amount@0x9623063377ad1b27544c965ccd7342f7ea7e88c7}"

[table.curation__collected]
story = "curators of {subgraphDeploymentID} collected {tokens:amount@0x9623063377ad1b27544c965ccd7342f7ea7e88c7}"

