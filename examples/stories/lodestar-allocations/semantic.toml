story = "{curator} signalled {tokens:amount@0x9623063377ad1b27544c965ccd7342f7ea7e88c7} on {subgraphDeploymentID} for {signal} signal, tax {curationTax:amount@0x9623063377ad1b27544c965ccd7342f7ea7e88c7}"

