# Loopback-only RPC shim for the XDC nests (gooddollar-xdc, sablier-xdc).
# Why: rpc.xinfin.network (and erpc./rpc1.xinfin.network) sit behind Cloudflare, which answers 403 to a
# request with no User-Agent header, and nuthatch's RPC client sends none. curl works, nuthatch does not.
# This instance adds one and forwards. Point the nests' rpc_urls at http://127.0.0.1:18550.
# Own nginx instance as the service user, like nuthatch-public-proxy; it never touches the system nginx.
daemon off;
worker_processes 1;
pid /run/nuthatch-public-xdc/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /run/nuthatch-public-xdc/tmp/body;
    proxy_temp_path       /run/nuthatch-public-xdc/tmp/proxy;
    fastcgi_temp_path     /run/nuthatch-public-xdc/tmp/fastcgi;
    uwsgi_temp_path       /run/nuthatch-public-xdc/tmp/uwsgi;
    scgi_temp_path        /run/nuthatch-public-xdc/tmp/scgi;
    client_max_body_size  4m;
    server {
        listen 127.0.0.1:18550;
        location / {
            proxy_pass https://rpc.xinfin.network;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host rpc.xinfin.network;
            proxy_set_header User-Agent "nuthatch-indexer/5 (+https://nuthatch-indexer.com)";
            proxy_ssl_server_name on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
