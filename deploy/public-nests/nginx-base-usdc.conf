# nuthatch public read-only nests: the policy layer in front of the Base USDC nest (#3028).
#
# This is nginx.conf with the ports and runtime directory changed, nothing else: a second instance beside
# the Arc one (own unit, own state, own limit zones), so a change to one nest's front door can never take the
# other's down. Keep the two in step; the numbers are in docs/public-nests.md.
#
# Runs as its own nginx instance (nuthatch-public-base-usdc-proxy.service), as the unprivileged service user, on
# 127.0.0.1 only. It does NOT touch the system nginx or the host's Caddy. TLS and the public name stay
# with Caddy (Caddyfile.path), which forwards here; this file decides what may pass, and how
# fast, how big and for how long.
#
#   internet -> Caddy :443 (TLS, name) -> this nginx 127.0.0.1:8481 -> nuthatch 127.0.0.1:8121
#
# Why a second layer: stock Caddy has no per-IP rate limit (it needs the caddy-ratelimit plugin built in
# with xcaddy), and stock nginx has all of this. docs/operators.md "Per-caller rate limiting" says the
# gateway owns it; this is that gateway.
#
# Only the read routes below are forwarded. Everything else is 403 or 404 here, before it reaches the
# nest, and the nest itself runs with --no-admin, so the admin routes do not exist behind this either.
# tests: deploy/public-nests/test-proxy.sh (needs nginx and python3), docs/public-nests.md.
#
# The test script rewrites the four marked lines; keep them one per line.

daemon off;
worker_processes 1;
pid /run/nuthatch-public-base-usdc/nginx.pid;                       # TEST-PATH
error_log stderr warn;                                   # TEST-ERRLOG

events {
    worker_connections 512;
}

http {
    access_log syslog:server=unix:/dev/log,tag=nuthatch_public_base_usdc combined;   # TEST-LOG
    server_tokens off;
    default_type application/json;

    # The compiled-in temp paths are under /var/lib/nginx and not writable by the service user.
    client_body_temp_path /run/nuthatch-public-base-usdc/tmp/body;     # TEST-PATH
    proxy_temp_path       /run/nuthatch-public-base-usdc/tmp/proxy;    # TEST-PATH
    fastcgi_temp_path     /run/nuthatch-public-base-usdc/tmp/fastcgi;  # TEST-PATH
    uwsgi_temp_path       /run/nuthatch-public-base-usdc/tmp/uwsgi;    # TEST-PATH
    scgi_temp_path        /run/nuthatch-public-base-usdc/tmp/scgi;     # TEST-PATH

    # The caller's address is whatever Caddy (loopback) says it is. A request that did not come from
    # loopback cannot set it, so reaching this port directly gets no spoofed identity.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # ---- Abuse limits. Numbers are in docs/public-nests.md; change them there too. ----
    # Per IP. /sql, /explain and /mcp each cost the nest an analytical query; the reads are cheap.
    limit_req_zone $binary_remote_addr zone=per_ip_query:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=per_ip_read:10m  rate=120r/m;
    # Everyone together, so a crowd of addresses cannot starve the two query permits the nest has.
    limit_req_zone $server_name        zone=all_query:1m     rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # Size and time. The nest refuses a statement over 16 KiB itself; 32k leaves room for JSON around it.
    client_max_body_size         32k;
    client_body_buffer_size      32k;
    client_header_buffer_size    4k;
    large_client_header_buffers  4 16k;       # a GET /sql?q= of the full 16 KiB, percent-encoded, fits
    client_header_timeout        5s;
    client_body_timeout          5s;
    send_timeout                 15s;
    keepalive_timeout            15s;
    keepalive_requests           100;
    reset_timedout_connection    on;

    upstream nest {
        server 127.0.0.1:8121;                                # TEST-UPSTREAM
        keepalive 8;
    }

    # What every forwarded location does. The URI sent upstream is built from what nginx matched (its
    # own normalised $uri, or the table name the /table/ route captured), never the raw request line, so
    # what was matched here is exactly what the nest sees (no /sql/../_admin, no %2e%2e, no // tricks
    # reach it differently from how they were judged). The table route takes one plain table name.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_send_timeout    10s;
    # The nest's own statement timeout is 10 s (NUTHATCH_SQL_TIMEOUT_MS in the env file). This is the
    # backstop: nothing waits on the nest longer than 15 s.
    proxy_read_timeout    15s;
    proxy_buffering on;
    proxy_intercept_errors off;

    server {
        listen 127.0.0.1:8481;                                # TEST-LISTEN
        server_name _;

        limit_conn per_ip_conn 4;

        # CORS: the showcase page and agents call /sql, /explain and /mcp from any origin. Read-only routes
        # only, so "*" exposes nothing a direct call does not. A preflight is answered here (204) and never
        # reaches the nest; it skips the rate limit because it costs nothing. OPTIONS is named in each
        # limit_except so that it stays in the location that holds the 204 (limit_except is its own block).
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type, accept, mcp-session-id, mcp-protocol-version, last-event-id" always;
        add_header Access-Control-Expose-Headers "mcp-session-id, retry-after" always;
        add_header Access-Control-Max-Age       "600" always;

        # ---- Refuse by name what must never be reachable, with a 403 that says why. ----
        # The nest runs with --no-admin, so these 404 there too; this is the second lock.
        location ^~ /_admin  { default_type text/plain; return 403 "not served here\n"; }
        location = /metrics  { default_type text/plain; return 403 "not served here\n"; }

        # ---- Query routes: the costly ones. GET or POST, nothing else. ----
        location = /sql {
            if ($request_method = OPTIONS) { return 204; }
            limit_except GET POST OPTIONS { deny all; }
            limit_req zone=per_ip_query burst=15 nodelay;
            limit_req zone=all_query    burst=40 nodelay;
            proxy_pass http://nest$uri$is_args$args;
        }
        location = /explain {
            if ($request_method = OPTIONS) { return 204; }
            limit_except GET POST OPTIONS { deny all; }
            limit_req zone=per_ip_query burst=15 nodelay;
            limit_req zone=all_query    burst=40 nodelay;
            proxy_pass http://nest$uri$is_args$args;
        }
        # MCP over Streamable HTTP is POST only (a GET is 405 at the nest). A browser page is refused
        # at the nest by its Origin check; MCP clients send none.
        location = /mcp {
            if ($request_method = OPTIONS) { return 204; }
            limit_except POST OPTIONS { deny all; }
            limit_req zone=per_ip_query burst=15 nodelay;
            limit_req zone=all_query    burst=40 nodelay;
            proxy_pass http://nest$uri$is_args$args;
        }

        # ---- Discovery and health: cheap reads, GET only. ----
        location = /           { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest$uri$is_args$args; }
        location = /health     { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest$uri$is_args$args; }
        location = /ready      { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest$uri$is_args$args; }
        location = /nest       { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest$uri$is_args$args; }
        location = /shape      { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest$uri$is_args$args; }
        location = /schema     { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest$uri$is_args$args; }
        location = /tables     { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest$uri$is_args$args; }
        location ~ "^/table/([A-Za-z0-9_-]{1,128})\z" { limit_except GET { deny all; } limit_req zone=per_ip_read burst=30 nodelay; proxy_pass http://nest/table/$1$is_args$args; }

        # Everything else the nest could answer (/entities, /derived, /balances, /diff, /api, /at,
        # /graphql, /sync, ...) is not offered on the public URL. Add a route here on purpose, not by default.
        location / { default_type text/plain; return 404 "not found\n"; }
    }
}
