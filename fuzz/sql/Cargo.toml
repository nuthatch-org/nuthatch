[package]
name = "nuthatch-fuzz-sql"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace, apart from `fuzz/`: this one links the whole engine, dbsp included, and the
# decode targets must not (fuzz/README.md, nuthatch#581).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"

[dependencies.nuthatch]
path = "../.."
default-features = false

[profile.release]
debug = 1

[[bin]]
name = "sql_confinement"
path = "fuzz_targets/sql_confinement.rs"
test = false
doc = false
bench = false

# #2743: the parsers that take a gateway's bytes. Here rather than in `fuzz/` because they live in
# the engine crate.
[[bin]]
name = "cid_car"
path = "fuzz_targets/cid_car.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subgraph_manifest"
path = "fuzz_targets/subgraph_manifest.rs"
test = false
doc = false
bench = false

# Burrmill's vendored parquet source, at its rev: a patch applies only from the root manifest, so
# burrmill's own does not reach this build.
[patch.crates-io]
datafusion-datasource-parquet = { git = "https://github.com/nuthatch-org/burrmill", rev = "24cc93e1179ab80ea9fbbb0aed10574e6866b65c" }
