[package]
name = "nuthatch-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A nest's identity: its NID and data identity, from its files' bytes, with no filesystem."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
