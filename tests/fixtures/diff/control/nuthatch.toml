# RFC-0071 step 3's control-plane fixture: mainnet blocks 26,241,000 to 26,243,100, which hold a
# Paused and an Unpaused, two proxies' AdminChanged, a RoleAdminChanged, and one transaction that
# deploys an upgradeable system (Upgraded, OwnershipTransferred, RoleGranted, RoleRevoked). LINK and
# the ENS registrar are indexed beside them for movements and approvals. Sealed by `bench backfill
# --seal-direct`; tests/diff_range.rs tells its story and compares it with golden/.
[nest]
name = "control-plane"
chain = "mainnet"
chain_id = 1
rpc_urls = ["https://rpc.mevblocker.io", "https://eth.drpc.org", "https://1rpc.io/eth"]
schema_version = 2

[[contracts]]
alias = "link"
address = "0x514910771af9ca656af840dff83e8264ecf986ca"
start_block = 26241000
abi = "abis/erc20.json"

