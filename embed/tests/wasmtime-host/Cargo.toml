[package]
name = "nuthatch-embed-wasmtime-host"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "RFC-0077 S2: the reference non-browser host for the plain module's `abi: 1`, on wasmtime, as a test harness."

[[bin]]
name = "wasmtime-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
ureq = "3"
# The last release whose MSRV is the pinned 1.95. Apache-2.0 WITH LLVM-exception. Never a dependency
# of the binary: this crate has its own lockfile, and RFC-0077 §1a's gate checks the binary's.
wasmtime = { version = "48", features = ["winch"] }

[workspace]
