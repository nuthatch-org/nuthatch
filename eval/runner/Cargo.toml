[package]
name = "nuthatch-eval-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "The RFC-0016 Tier-B and RFC-0017 authoring eval runners. Dev tooling, never in the binary."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
shlex = "1"
tempfile = "3"
toml = "0.8"
ureq = { version = "2", default-features = false }

[[bin]]
name = "run-tier-b"
path = "src/bin/run-tier-b.rs"

[[bin]]
name = "run-authoring"
path = "src/bin/run-authoring.rs"
