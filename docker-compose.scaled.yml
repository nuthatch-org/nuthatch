# Scaled mode (RFC-0022). **Not** the way to run nuthatch - the single binary is, and embedded mode
# needs none of this. This exists for the distributed self-hosted fleet an operator runs across
# machines, and for the parity suite that proves the Postgres hot store answers identically to redb.
#
# The full RFC-0022 stack: an external hot store, a **control plane** holding desired state, a
# **writer pool** whose members take cursor leases, and an **FE tier** that serves from the shared
# store and owns nothing. Every service here corresponds to something that exists and is tested.
#
#   docker compose -f docker-compose.scaled.yml up -d postgres     # just the store (for the tests)
#   NUTHATCH_TEST_PG=postgres://nuthatch:$POSTGRES_PASSWORD@127.0.0.1:5433/nuthatch \
#     cargo test --features postgres-store --test pg_parity
#
#   docker compose -f docker-compose.scaled.yml --profile fleet up \
#     --scale writer=2 --scale fe=3        # control plane + a writer pool + an FE tier
#
# **The fleet profile needs a `./nest` directory**, and it must be **owned by uid 10001**:
#
#     nuthatch init 0xYourContract --chain arbitrum-one --dir nest
#     sudo chown -R 10001:10001 nest
#
# Two separate traps live here, both found by running this on a real Linux host:
#
# 1. **Without the directory** the FE containers exit immediately - they load the nest's config,
#    registry and views at startup and there is nothing to load. The writers survive, because they take
#    work from the control plane rather than from disk. That asymmetry is baffling if nobody warns you.
#
# 2. **With a root-owned directory** the FE containers exit with `Permission denied (os error 13)`.
#    The image runs unprivileged as uid 10001 - deliberately, and worth keeping - so a root-owned bind
#    mount is unwritable to it. **This works on Docker Desktop and fails on Linux**, because Desktop
#    fakes mount permissions on macOS. So it passes on a laptop and breaks on every real deployment,
#    which is the worst possible way for a defect to behave.
#
# Control-plane calls need the token:
#   curl -H "authorization: Bearer $NUTHATCH_CONTROL_TOKEN" localhost:8290/workers
#
# The fleet profile needs the **scaled** image - `ghcr.io/nuthatch-org/nuthatch:<version>-scaled`.
# The default published image is the embedded build and deliberately carries no database driver, so
# `worker` and `control` are not in it. Set `NUTHATCH_IMAGE` to pick a version.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuthatch
      # Same reasoning as `NUTHATCH_CONTROL_TOKEN` below: `PG_BIND` is parameterised, so the easiest
      # override to reach for pairs an exposed 5433 with a credential everyone can read. Postgres has
      # no equivalent of the control plane's refuse-to-start guard, so this is the only thing standing
      # between `PG_BIND=0.0.0.0` and an open database.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set a database password, e.g. POSTGRES_PASSWORD=$(openssl rand -hex 16)}"
      POSTGRES_DB: nuthatch
      # `--locale-provider=icu` is deliberately NOT used, and the initdb locale is C. The hot store
      # keys on zero-padded strings whose *byte* order is chain order; a locale-aware default
      # collation would reorder them. The table DDL pins `COLLATE "C"` per column as well, so this is
      # belt and braces - but a database whose default disagrees with its columns is a trap for the
      # next person who adds a table and forgets.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # 5433 on the host: a developer running the parity suite very likely has a local Postgres on
    # 5432, and silently connecting to *that* would create schemas in someone's real database.
    #
    # `PG_BIND` defaults to **127.0.0.1** and should stay that way on any machine you do not control
    # the network of - the credentials in this file are `nuthatch:nuthatch`. The multi-machine lab
    # overrides it with the control box's **private** address so remote writers can reach the store;
    # that is a closed 10.44.0.0/16 network, not the internet. Setting this to 0.0.0.0 publishes an
    # unauthenticated-in-practice database to the world.
    ports:
      - "${PG_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - nuthatch-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuthatch -d nuthatch"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The control plane: what the fleet *should* run. Writes desired state; commands nobody.
  #
  # Bound to localhost on the host side because it decides what the whole fleet runs - reaching it
  # from elsewhere means a tunnel or a token, and the binary refuses to serve off-localhost without
  # `NUTHATCH_CONTROL_TOKEN` rather than merely warning about it.
  control:
    profiles: ["fleet"]
    image: ${NUTHATCH_IMAGE:-ghcr.io/nuthatch-org/nuthatch:5.21.0-scaled}
    depends_on:
      postgres: { condition: service_healthy }
    command: >-
      control --listen 0.0.0.0:8290
      --db postgres://nuthatch:${POSTGRES_PASSWORD}@postgres:5432/nuthatch
    environment:
      # **Required, not optional.** Docker publishes a port by binding 0.0.0.0 *inside* the container,
      # so the control plane always sees an off-localhost bind and refuses to start without a token -
      # correctly, since it decides what the whole fleet runs. An earlier version of this file left it
      # empty with a comment about the host-side 127.0.0.1 mapping, and the stack simply would not come
      # up: `Error: refusing to serve the control-plane API on '0.0.0.0:8290' without a token`.
      #
      # No default, deliberately. A literal default here defeats the binary's own guard in the one
      # case it exists for: `CONTROL_BIND` is parameterised, so reaching the control plane from
      # another host means setting it to 0.0.0.0 - at which point a baked-in token means the bind is
      # *accepted*, protected by a string published in this repo. The guard would then only ever fire
      # for operators who were already on localhost. `:?` fails the stack with this message instead.
      NUTHATCH_CONTROL_TOKEN: "${NUTHATCH_CONTROL_TOKEN:?set a control-plane token, e.g. NUTHATCH_CONTROL_TOKEN=$(openssl rand -hex 32)}"
    # `CONTROL_BIND` defaults to 127.0.0.1 - see `PG_BIND` above. Binding this off-localhost without
    # `NUTHATCH_CONTROL_TOKEN` set is refused by the binary itself, which is the guard that matters.
    ports:
      - "${CONTROL_BIND:-127.0.0.1}:8290:8290"

  # The writer pool: owns cursors, ingests, seals.
  #
  # **This is now safely scalable** - `--scale writer=3` - which it was not before RFC-0022 slice 4.
  # Until the lease existed, "exactly one writer per chain" was enforced by *this file saying so*;
  # now a cursor is held by whichever worker holds its lease, and a stale holder's writes are refused
  # by the store rather than merely discouraged by a comment.
  #
  # Each replica gets its own worker id from the container hostname, which compose makes unique.
  # Two workers sharing an id would look like one worker to the registry and could both hold what
  # each believed was its own lease - so it is derived rather than configured.
  writer:
    profiles: ["fleet"]
    image: ${NUTHATCH_IMAGE:-ghcr.io/nuthatch-org/nuthatch:5.21.0-scaled}
    depends_on:
      postgres: { condition: service_healthy }
    # `worker`, not `dev`. `dev` indexes a nest directory it owns outright and knows nothing about the
    # control plane - running two of those against one store is the double-writer bug, not a pool.
    # `worker` reconciles: it heartbeats, takes a lease for each cursor it is assigned, and indexes
    # only what it holds. The worker id defaults to the container hostname, which compose makes unique
    # per replica; two workers sharing an id would look like one to the registry.
    command: >-
      worker
      --control-db postgres://nuthatch:${POSTGRES_PASSWORD}@postgres:5432/nuthatch
      --hot-store postgres://nuthatch:${POSTGRES_PASSWORD}@postgres:5432/nuthatch
      --chains arbitrum-one
      --budget-mb 2048
    volumes:
      - ./nest:/nest
    # No host port: with several replicas there is nothing sensible to publish, and a writer's HTTP
    # surface is for health and metrics rather than for serving reads - that is the FE tier's job.

  # Query-FE nodes: serve from the shared store, own no cursor, and are interchangeable. Scale this
  # one freely - `docker compose --profile fleet up --scale fe=5` - because nothing here writes.
  fe:
    profiles: ["fleet"]
    image: ${NUTHATCH_IMAGE:-ghcr.io/nuthatch-org/nuthatch:5.21.0-scaled}
    depends_on:
      postgres: { condition: service_healthy }
    command: >-
      serve --dir /nest --listen 0.0.0.0:8288
      --hot-store postgres://nuthatch:${POSTGRES_PASSWORD}@postgres:5432/nuthatch
    # **Read-only, and it must stay that way.** An FE owns no cursor and has no business writing to a
    # nest directory; `:ro` is what makes that structural instead of merely intended.
    #
    # It could not be `:ro` before RFC-0022 **slice 3b**: `build_nest` opened the nest's local redb
    # unconditionally - even when handed a `store_override` pointing at the shared Postgres - so an FE
    # created a redb file it never read and died with `Read-only file system (os error 30)`. Slice 3b
    # resolves the hot store once, so nothing downstream knows or cares which backend it got.
    #
    # If this ever needs to become writable again, something has reintroduced a local-file dependency
    # on the read path. Fix that instead.
    volumes:
      - ./nest:/nest:ro
    ports:
      - "127.0.0.1:8289-8299:8288"

volumes:
  nuthatch-pg:
