[package]
name = "nuthatch-decode"
version = "3.0.0-alpha.1"
edition = "2021"
rust-version = "1.95"
description = "ABI-driven, deterministic event decode for nuthatch - no dbsp dependency."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
alloy-dyn-abi = "1.6"
alloy-json-abi = "1.6"
alloy-primitives = "1.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
