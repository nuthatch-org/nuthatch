[package]
name = "nuthatch"
version = "5.3.3"
edition = "2021"
autotests = false
# **Measured, not asserted.** `cargo +1.85.0 check` fails outright - `cranelift-assembler-x64` needs
# 1.94, actix 1.88 - so the 1.85 this declared until 1.0 was a promise nothing could keep. 1.95 is what
# `rust-toolchain.toml`, CI, and the release build all use, so it is the only version we can honestly
# claim. Raising it needs a reason; lowering it needs a green build on the lower toolchain.
rust-version = "1.95"
description = "Be your own indexer. One Rust binary, one command, live in under two minutes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuthatch-org/nuthatch"
homepage = "https://www.nuthatch-indexer.com"
readme = "README.md"
keywords = ["blockchain", "indexer", "ethereum", "self-hosted", "mcp"]
categories = ["command-line-utilities", "database", "cryptography::cryptocurrencies"]
# Keep the published crate lean: the scratch/docs aren't needed to build the host, and
# fuzz/ is dev-only tooling (its own package, nightly-only, never in the data path per CLAUDE.md §4).
exclude = ["/scratchpad", "/fuzz", "/decode", "/tools", "/count"]

[[bin]]
name = "nuthatch"
path = "src/main.rs"

# One integration binary avoids linking Burrmill, DBSP and the complete crate into 81 separate
# executables. These four remain isolated because they change process-global environment variables.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "analytics_budget"
path = "tests/analytics_budget.rs"

[[test]]
name = "e2e_fe_admin_exposure"
path = "tests/e2e_fe_admin_exposure.rs"

[[test]]
name = "hot_store_cache_is_measurable"
path = "tests/hot_store_cache_is_measurable.rs"

[[test]]
name = "sql_concurrency_is_measurable"
path = "tests/sql_concurrency_is_measurable.rs"

# These two do not mutate environment, but they intentionally observe process-global metrics or run
# a long restart/reseal sequence. Keeping them out of the broad parallel harness makes those claims
# about their own process rather than its 360 neighbours.
[[test]]
name = "e2e_warm_restart"
path = "tests/e2e_warm_restart.rs"

[[test]]
name = "e2e_maintained_reorg"
path = "tests/e2e_maintained_reorg.rs"

[[test]]
name = "memory_gauges_are_published"
path = "tests/memory_gauges_are_published.rs"

[[test]]
name = "skill_refs"
path = "tests/skill_refs.rs"

[[test]]
name = "network_contract"
path = "tests/network_contract.rs"
required-features = ["graph"]

[[test]]
name = "delegation_fold_corpus"
path = "tests/delegation_fold_corpus.rs"
required-features = ["graph"]

[[test]]
name = "crash_points"
path = "tests/crash_points.rs"
required-features = ["crash-points"]

[dependencies]
# graph-node's own pluralisation, so a generated root field name matches it by construction rather
# than by a rule reimplemented here (`graph/src/data/graphql/ext.rs:360` calls `to_plural`).
# BSD-2-Clause, already on deny.toml's allowlist, pure Rust - no effect on the static binary.
Inflector = { version = "0.11.3", optional = true }
nuthatch-decode = { path = "decode" }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
futures = "0.3"
alloy-json-abi = "1.6"
alloy-dyn-abi = "1.6"
alloy-primitives = "1.6"
# RFC-0063 §8: a downloaded block partition is checked by re-deriving every header hash, withdrawals
# root, transactions root and receipts root. Pure Rust; their optional C crates (c-kzg, blst,
# secp256k1) stay off. MIT OR Apache-2.0.
alloy-rlp = { version = "0.3", default-features = false }
alloy-consensus = { version = "2.5", default-features = false, features = ["std", "serde"] }
alloy-rpc-types-eth = { version = "2.5", default-features = false, features = ["std", "serde"] }
base64 = { version = "0.22", optional = true }
k256 = { version = "0.13", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
# The parser role: entities and lowering read its AST.
sqlparser = { version = "0.62", features = ["visitor"] }
serde_json = "1"
csv = "1"
# Subgraph manifests are YAML (`init --from-subgraph`). yaml-rust2 rather than
# serde_yaml, which is archived (RUSTSEC-2024-0320) and would trip the
# `unmaintained = "workspace"` gate in deny.toml on a direct dependency.
# MIT OR Apache-2.0, so it clears the licence allow-list unchanged.
yaml-rust2 = "0.11"
toml = "0.8"
serde_ignored = "0.1"
redb = "2"
arrow = { version = "59", features = ["ipc"] }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
# Already in the tree via parquet; an offchain snapshot is parsed from the same bytes it was hashed from.
bytes = "1"
# Already in the tree via parquet and arrow-buffer; declared directly so `graph_decimal` can name it.
# graph-node computes its own `BigDecimal` on this crate, and the prices a subgraph stores need an
# integer wider than any fixed-width type: `sqrtPriceX96^2` reaches 2^384.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
# The analytical engine (RFC-0044 Amendment 2), pinned by rev. Its arrow is not ours, so no batch
# crosses; rows cross as JSON, and Arrow results as IPC.
burrmill = { git = "https://github.com/nuthatch-org/burrmill", rev = "0777d7620a862ae55cbce09938199f32324b3112", default-features = false, features = ["datafusion"] }
dbsp = "0.320"
# RFC-0041 §4 step 4 (#870): the dynamic row representation entity circuits are built over has to
# satisfy `dbsp::DBData`, which wants `SizeOf` and rkyv archival. Both are already in the tree via
# dbsp itself - these pin the same versions as direct dependencies so the derives are reachable.
size-of = { package = "feldera-size-of", version = "0.1.7" }
rkyv = { version = "0.7.46", default-features = false, features = ["std", "size_64", "validation"] }
sha2 = "0.10"
# RFC-0052 S4: an S3 ETag is an MD5, so a shallow `publish verify` can see replaced bytes. Already in
# the tree via object_store at this version; MIT OR Apache-2.0.
md-5 = "0.10"
arc-swap = "1"
ed25519-dalek = "2"
getrandom = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
# Already in the tree via axum; named so `bind_and_serve` can give hyper a timer (#1660).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "service"] }
# `cors` only. Already in the tree via reqwest, so this adds a feature rather than a crate, and CORS
# is not worth hand-rolling: getting `Vary: Origin` wrong poisons a shared cache (#1318).
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex = "0.4"
flate2 = "1"
tar = "0.4"
tempfile = "3"
rustyline = "18.0.1"
# RFC-0019 slice 2: the object-store (S3) registry backend. `object_store` core is already in the tree
# transitively (via dbsp/feldera-storage), so this optional dep only adds the `aws` S3/HTTP *transport*
# when the feature is on - the FsStore covers the self-hosted case, S3 is the fleet path. Pinned to 0.12
# to match dbsp's version so the subtree dedupes (a 0.11 pin duplicated the whole object_store tree).
# Apache-2.0 (arrow-rs family). `aws` covers S3/MinIO/R2 via env config (AWS_ENDPOINT etc).
object_store = { version = "0.12", optional = true, features = ["aws"] }
# RFC-0022 slice 2: the Postgres hot store for scaled mode. The **blocking** client, not
# tokio-postgres - `HotStore` is a synchronous trait (redb is synchronous) and the serving layer
# already does blocking store reads from async handlers. Switching that is a separate refactor with
# its own justification, not something to smuggle in beside a new backend. All MIT/Apache-2.0.
postgres = { version = "0.19", optional = true }
url = { version = "2", optional = true }

[features]
# The S3 registry ships **on**. It was off by default until 2026-07-28, which meant the released
# binary and the container image answered `--registry s3://…` with "needs a build with
# `--features object-store`" - so for anyone who did not build from source, the object-store backend
# the docs advertise simply did not exist. Measured cost of enabling it: **two** lines of dependency
# tree, because `object_store` is already compiled (via dbsp/feldera-storage) and `url` is already
# present; the feature only adds the `aws` transport on top of a crate we were building anyway.
default = ["object-store"]
# Object-store (S3-compatible) nest-registry backend (RFC-0019 slice 2). Kept as a named feature so a
# build that genuinely wants it gone can `--no-default-features`.
object-store = ["dep:object_store", "dep:url"]
# Postgres hot store (RFC-0022 slice 2). **Off by default and it must stay that way**: non-negotiable
# 1 is that embedded mode runs with zero external services, and a default-on Postgres backend would
# put a database in the dependency tree of the single-binary story. Scaled mode opts in.
postgres-store = ["dep:postgres"]
# RFC-0046 S2: an operator's optional x402 counter. It is deliberately not part of the default
# binary: an unconfigured self-hoster remains entirely unpriced (#1217).
counter = ["dep:base64", "dep:k256", "alloy-primitives/k256"]
# RFC-0060 §5.6: the Graph network facade. Off by default: a default build never shows it and
# refuses a nest that needs it.
graph = ["folds", "dep:Inflector"]
# RFC-0059: checkpointed folds. Off by default, and a default build refuses a nest that ships `folds/`.
folds = []
# #1717: named points where a test build aborts when `NUTHATCH_CRASH_AT` names them. Off by default,
# and a default build compiles every point to nothing.
crash-points = []

[dev-dependencies]
proptest = "1"
# `start_paused` for virtual time in tests. Dev-only, so the shipped binary is unchanged: it lets a
# retry-pacing test assert *how long* a pause was without actually waiting for it (#361).
tokio = { version = "1", features = ["test-util"] }
# RFC-0046 S1: tests sign with alloy's EIP-712 hasher; the verifier recovers with k256. None of
# these is on the default binary - `src/x402.rs` is `#[cfg(test)]`.
alloy-primitives = { version = "1.6", features = ["k256"] }
alloy-sol-types = "1.6"

# Line tables keep backtrace file:line; full variable info cost ~2.7 GB per `cargo test` target.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true

# What the release workflow ships. CI and the footprint gates build the thin `release` profile.
# No `panic = "abort"`: dbsp and folds rely on catch_unwind.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
